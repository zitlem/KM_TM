/* back is the dialog that sent us here — the tool being edited is still in
   state.draft either way, so returning lands exactly where you left off. */
function leaveHolderDialog(back) {
  if (back === 'compPick') set({ dialog: { kind: 'compPick', back: 'tool', replaceU: null }, hDraft: null, hDraftError: '' });
  else if (back === 'tool') set({ dialog: { kind: 'tool' }, hDraft: null, hDraftError: '' });
  else set({ dialog: null, hDraft: null, hDraftError: '' });
}

function saveHolder(back) {
  var h = state.hDraft;
  if (!h) return;
  if (!String(h.name || '').trim()) {
    return set({ hDraftError: 'Give the holder a name — it is what you pick it by.' });
  }
  if (!(h.segs || []).some(function (g) { return num(g.len) > 0; })) {
    return set({ hDraftError: 'Give it at least one section with a length, or it has nothing to add to the gauge length.' });
  }
  var saved = JSON.parse(JSON.stringify(h));
  saved.segs = (saved.segs || []).filter(function (g) { return num(g.len) > 0; });
  var exists = state.holders.some(function (x) { return x.id === saved.id; });
  state.holders = exists
    ? state.holders.map(function (x) { return x.id === saved.id ? saved : x; })
    : state.holders.concat([saved]);
  markHolders();
  leaveHolderDialog(back);
}

    var tr = clickable(el('tr', {}), function () { openJob(j.id); });
    jobRowCells(j, { split: true }).forEach(function (c) { tr.appendChild(c); });
    tr.appendChild(el('td', {}, el('div', { style: 'display:flex;gap:var(--space-2);justify-content:flex-end' },
      el('button', { class: 'btn btn-ghost', text: 'Open setup', onclick: function () { openJob(j.id); } }),
      el('button', { class: 'btn btn-ghost', text: 'Delete', onclick: function () { confirmDeleteJob(j); } })
    )));
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  box.appendChild(table);
  if (!jobs.length) {
    box.appendChild(el('p', { class: 'text-muted', style: 'font-size:13px;padding:var(--space-6) 0 var(--space-3);margin:0;text-align:center',
      text: 'No ' + typeLabel(mt).toLowerCase() + ' jobs on record.' }));
  }
  return el('div', {}, head, box);
}

/* ── job detail ──────────────────────────────────────────────────────── */

function viewJob() {
  var job = jobById(state.jobId);
  if (!job) return viewJobs();

  var heading = [job.jobno || 'New job', job.rev ? 'Rev ' + job.rev : ''].filter(Boolean).join(' ');
  var jobType = machineTypeOf(job);

  var head = el('div', { style: 'display:flex;align-items:flex-end;justify-content:space-between;gap:var(--space-6);margin-bottom:var(--space-6)' },
    el('div', {},
      el('div', { class: 'text-muted', style: 'font-size:11px;letter-spacing:.12em;text-transform:uppercase', text: 'Job setup' }),
      el('h2', { style: 'margin:0', text: heading })
    ),
    el('div', { style: 'display:flex;gap:var(--space-2)' },
      el('button', { class: 'btn btn-secondary', text: 'Back to ' + typeLabel(jobType).toLowerCase() + ' jobs',
        onclick: function () { set({ view: 'jobs', jobType: jobType }); } }),
      (function () {
        var b = el('button', { class: 'btn btn-primary blueprint', onclick: function () { printSheetFor(job); } });
        corners().forEach(function (c) { b.appendChild(c); });
        b.appendChild(document.createTextNode('Print setup sheet'));
        return b;
      })()
    )
  );

  function textField(label, key, ph, type) {
    return el('div', { class: 'field' },
      el('label', { text: label }),
      el('input', Object.assign({ class: 'input', 'data-k': 'job-' + key, value: job[key] || '',
        oninput: function (e) { patchJob(job.id, defineOne(key, e.target.value)); } },
        type ? { type: type } : {}, ph ? { placeholder: ph } : {}))
    );
  }
  function defineOne(k, v) { var o = {}; o[k] = v; return o; }

  var meta = frame('padding:var(--space-6);margin-bottom:var(--space-8)');
  meta.appendChild(el('div', { style: 'display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-4)' },
    textField('Job / work order #', 'jobno', 'WO-1042'),
    textField('Rev', 'rev', 'C'),
    el('div', { class: 'field' },
      el('label', { text: 'Machine' }),
      select({ class: 'input', 'data-k': 'job-machine', onchange: function (e) { patchJob(job.id, { machine: e.target.value }); } },
        state.machines.map(function (m) { return m.name; }), job.machine || '')
    ),
    el('div', { class: 'field' },
      el('label', { text: 'Last run' }),
      el('div', { style: 'display:flex;gap:var(--space-2)' },
        el('input', { class: 'input', 'data-k': 'job-lastRun', type: 'date', value: job.lastRun || '',
          oninput: function (e) { patchJob(job.id, { lastRun: e.target.value }); } }),
        el('button', { class: 'btn btn-secondary', style: 'flex:none', text: 'Today',
          onclick: function () { patchJob(job.id, { lastRun: today() }); } })
      )
    )
  ));
  meta.appendChild(el('div', { class: 'field', style: 'margin-top:var(--space-4)' },
    el('label', { text: 'Setup notes' }),
    el('textarea', { class: 'input', 'data-k': 'job-notes', placeholder: 'Workholding, datum, stickouts, program number, anything the next operator needs.',
      value: job.notes || '', oninput: function (e) { patchJob(job.id, { notes: e.target.value }); } })
  ));

  /* picker */
  var pq = state.pickSearch.trim().toLowerCase();
  var picked = (job.tools || []).map(function (x) { return x.toolId; });

  var pickBox = frame('padding:var(--space-3)');
  var pickList = el('div', { style: 'display:grid;gap:1px;max-height:520px;overflow-y:auto;overflow-x:hidden' });
  // Which registry this kind of machine draws from — 'both' for a mill-turn.
  var tooling = toolingFor(jobType);
  var pickRows = sortTools(state.tools.filter(function (t) { return tooling === 'both' || t.machine === tooling; }))
    .filter(function (t) {
      return !pq || [t.tnum, t.desc, t.type, t.vendor].some(function (v) { return String(v || '').toLowerCase().indexOf(pq) >= 0; });
    });
  pickRows.forEach(function (t) {
    var added = picked.indexOf(t.id) >= 0;
    pickList.appendChild(el('div', { style: 'display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2);border-bottom:1px solid color-mix(in srgb, var(--color-text) 8%, transparent)' },
      el('div', { style: 'font-family:var(--font-heading);font-size:15px;width:52px;font-variant-numeric:tabular-nums', text: t.tnum }),
      el('div', { style: 'flex:1;min-width:0' },
        el('div', { style: 'font-size:13px', text: t.desc }),
        el('div', { class: 'text-muted', style: 'font-size:11px', text: spec(t) })
      ),
      el('button', { class: 'btn btn-secondary', style: 'font-size:12px', disabled: added, text: added ? 'Added' : '+ Add',
        onclick: function () {
          if (added) return;
          patchJob(job.id, { tools: (job.tools || []).concat([{ toolId: t.id, note: '' }]) });
        } })
    ));
  });
  pickBox.appendChild(pickList);
  if (!pickRows.length) {
    pickBox.appendChild(el('p', { class: 'text-muted', style: 'font-size:13px;padding:var(--space-4);margin:0;text-align:center', text: 'No matching tools in this registry.' }));
  }

  var pickSection = el('section', {},
    el('div', { style: 'display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);margin-bottom:var(--space-4)' },
      el('h4', { style: 'margin:0', text: tooling === 'both' ? 'Mill and lathe registries'
        : (tooling === 'lathe' ? 'Lathe registry' : 'Mill registry') }),
      el('input', { class: 'input', style: 'width:190px', 'data-k': 'pickSearch', placeholder: 'Search', value: state.pickSearch,
        oninput: function (e) { set({ pickSearch: e.target.value }); } })
    ),
    pickBox
  );

  /* tools on this setup */
  var listBox = frame('padding:var(--space-4)');
  var ltable = el('table', { class: 'table' },
    el('thead', {}, el('tr', {}, ['Stn', 'Description', 'Spec', 'Photo', 'Setup note', ''].map(function (h) { return el('th', { text: h }); })))
  );
  var lbody = el('tbody');
  (job.tools || []).forEach(function (x, i) {
    var t = state.tools.filter(function (y) { return y.id === x.toolId; })[0] || {};
    lbody.appendChild(el('tr', {},
      el('td', { style: 'font-family:var(--font-heading);font-size:15px;font-variant-numeric:tabular-nums', text: t.tnum || '—' }),
      el('td', { text: t.desc || 'Removed tool' }),
      el('td', { class: 'text-muted', style: 'font-size:12px', text: t.id ? spec(t) : '' }),
      el('td', {}, t.id ? toolPhotoButton(t) : null),
      el('td', {}, el('input', { class: 'input', style: 'min-height:30px;font-size:13px', 'data-k': 'note-' + i,
        placeholder: '1.25 stickout', value: x.note || '',
        oninput: function (e) {
          var v = e.target.value;
          patchJob(job.id, { tools: job.tools.map(function (y, k) { return k === i ? Object.assign({}, y, { note: v }) : y; }) });
        } })),
      el('td', { style: 'text-align:right' }, el('button', { class: 'btn btn-ghost', text: 'Remove', onclick: function () {
        patchJob(job.id, { tools: job.tools.filter(function (y, k) { return k !== i; }) });
      } }))
    ));
  });
  ltable.appendChild(lbody);
  listBox.appendChild(ltable);
  if (!(job.tools || []).length) {
    listBox.appendChild(el('p', { class: 'text-muted', style: 'font-size:13px;padding:var(--space-6) 0 var(--space-3);margin:0;text-align:center', text: 'Pick tools from the registry on the left.' }));
  }

  var count = (job.tools || []).length;
  var listSection = el('section', {},
    el('div', { style: 'display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-4)' },
      el('h4', { style: 'margin:0', text: 'Tools on this setup' }),
      el('span', { class: 'text-muted', style: 'font-size:12px', text: count + (count === 1 ? ' tool' : ' tools') })
    ),
    listBox
  );

  return el('div', {}, head, meta,
    el('div', { style: 'display:grid;grid-template-columns:1fr 1.15fr;gap:var(--space-8);align-items:start' }, pickSection, listSection));
}

/* ── dialogs ─────────────────────────────────────────────────────────── */

function dialogShell(widthStyle, titleText, bodyNode, actionNodes) {
  var box = frame((widthStyle || '') + ';background:var(--color-bg)');
  box.className = 'dialog blueprint';
  box.setAttribute('style', (widthStyle || 'width:min(440px,100%)') + ';background:var(--color-bg)');
  box.appendChild(el('div', { class: 'dialog-title', text: titleText }));
  box.appendChild(bodyNode);
  box.appendChild(el('div', { class: 'dialog-actions' }, actionNodes));
  return el('div', { class: 'dialog-backdrop' }, box);
}

/* The photo row inside the tool dialog: a thumbnail that opens full size,
   a file picker, and a remove. */
function photoPicker(d) {
  var has = !!(d.image || d.imageData);

  var thumb = el('div', {
    style: 'width:96px;height:72px;flex:none;border:1px solid var(--color-divider);display:grid;place-items:center;' +
           'overflow:hidden;background:var(--color-surface);font-size:11px;color:color-mix(in srgb, var(--color-text) 45%, transparent)' +
           (has ? ';cursor:zoom-in' : ''),
    text: has ? '' : 'No photo',
    onclick: function () { if (has) set({ dialog: { kind: 'image', tool: d, back: 'tool' } }); }
  });
  if (has) {
    var img = el('img', { style: 'width:100%;height:100%;object-fit:cover' });
    thumb.appendChild(img);
    imageUrl(d).then(function (u) { if (u) img.src = u; });
  }

  var file = el('input', { type: 'file', accept: 'image/*', style: 'display:none',
    onchange: function (e) {
      var f = e.target.files && e.target.files[0];
      if (!f) return;
      fileToJpegDataUrl(f).then(function (dataUrl) {
        d.imageData = dataUrl;
        render();
      }, function (err) { set({ draftError: err.message }); });
    } });

  return el('div', { style: 'display:flex;align-items:center;gap:var(--space-4);margin-top:var(--space-4);padding-top:var(--space-4);border-top:1px solid var(--color-divider)' },
    thumb,
    el('div', { style: 'display:flex;flex-direction:column;gap:var(--space-2);align-items:flex-start' },
      el('div', { class: 'text-muted', style: 'font-size:12px', text: has ? 'Click the photo to see it full size.' : 'A photo of the tool or its assembly, shown on demand.' }),
      el('div', { style: 'display:flex;gap:var(--space-2)' },
        el('button', { class: 'btn btn-secondary', text: has ? 'Replace photo' : 'Add photo', onclick: function () { file.click(); } }),
        has ? el('button', { class: 'btn btn-ghost', text: 'Remove photo', onclick: function () {
          d.removeImage = d.image || null;
          delete d.imageData;
          d.image = null;
          render();
        } }) : null
      ),
      file
    )
  );
}

/* Full-size photo, plus whatever notes the tool carries. */
function imageDialog() {
  var t = state.dialog.tool;
  var back = state.dialog.back;
  var img = el('img', { style: 'max-width:100%;max-height:60vh;display:block;margin:0 auto;border:1px solid var(--color-divider)' });
  imageUrl(t).then(function (u) {
    if (u) img.src = u;
    else img.replaceWith(el('p', { class: 'text-muted', style: 'font-size:13px;margin:0',
      text: store.connected ? 'The photo file is missing from the tools folder.' : 'Connect the data folder to see this photo.' }));
  });

  var body = el('div', { class: 'dialog-body' }, img);
  if (t.notes) {
    body.appendChild(el('p', { style: 'white-space:pre-wrap;margin:var(--space-4) 0 0;font-size:13px', text: t.notes }));
  }

  return dialogShell('width:min(860px,100%)', [t.tnum, t.desc].filter(Boolean).join(' — '), body, [
    el('button', { class: 'btn btn-secondary', text: 'Print this tool', onclick: function () { printToolCard(t); } }),
    el('button', { class: 'btn btn-secondary', text: 'Close', onclick: function () {
      if (back === 'tool') set({ dialog: { kind: 'tool' } });      // draft is still in state
      else closeDialog();
    } })
  ]);
}

function toolDialog() {
  var d = state.draft;
  if (!d) return null;
  var mill = d.machine !== 'lathe';
  var fields = fieldsFor(d.machine);
  var cols = mill ? 'repeat(auto-fit,minmax(140px,1fr))' : '1fr 1fr 1fr';
  var grid = el('div', { style: 'display:grid;grid-template-columns:' + cols + ';gap:var(--space-3)' });
  var g = mill ? assemblyGeom(d) : null;
  // The assembly owns the gauge length, so the field tracks it keystroke by
  // keystroke instead of waiting for Save — nothing here needs applying.
  var derivedGauge = !!(g && g.ok);
  if (derivedGauge) d.gauge = fmt3(g.gauge);

  fields.forEach(function (f) {
    var control;
    if (f.options) {
      control = select({ class: 'input', 'data-k': 'draft-' + f.k, onchange: function (e) { d[f.k] = e.target.value; render(); } },
        f.options, d[f.k] || f.options[0]);
    } else if (f.long) {
      control = el('textarea', { class: 'input', style: 'min-height:70px', 'data-k': 'draft-' + f.k,
        placeholder: f.ph || '', value: d[f.k] || '', oninput: function (e) { d[f.k] = e.target.value; } });
    } else if (derivedGauge && f.k === 'gauge') {
      control = el('input', { class: 'input', 'data-k': 'draft-gauge', value: d.gauge, readonly: 'readonly',
        style: 'color:var(--color-neutral-700);cursor:default' });
    } else {
      control = el('input', { class: 'input', 'data-k': 'draft-' + f.k, placeholder: f.ph || '', value: d[f.k] || '',
        oninput: function (e) { d[f.k] = e.target.value; render(); } });
    }
    grid.appendChild(el('div', { class: 'field', style: f.long ? 'grid-column:1/-1' : '' },
      el('label', { text: f.label }), control,
      derivedGauge && f.k === 'gauge'
        ? el('div', { class: 'text-muted', style: 'font-size:11px;margin-top:3px', text: 'From the assembly.' })
        : null));
  });

  var left = el('div', { style: 'display:grid;gap:var(--space-3);align-content:start' }, grid, photoPicker(d));
  var body = el('div', { class: 'dialog-body' });

  if (mill) {
    // auto-fit collapses to one column in a narrow window without needing a
    // media query — this file has no stylesheet hooks beyond the one <style>.
    body.appendChild(el('div', { style: 'display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:var(--space-6);align-items:start' },
      left, assemblyPanel(d, g)));
  } else {
    body.appendChild(left);
  }

  if (state.draftError) {
    body.appendChild(el('p', { style: 'font-size:13px;color:var(--color-accent-800);margin:var(--space-3) 0 0', text: state.draftError }));
  }

  return dialogShell('width:min(' + (mill ? 1080 : 720) + 'px,100%)',
    d.id ? 'Edit ' + (d.tnum || 'tool') : 'New ' + (d.machine === 'lathe' ? 'lathe' : 'mill') + ' tool', body, [
    el('button', { class: 'btn btn-secondary', text: 'Cancel', onclick: closeDialog }),
    el('button', { class: 'btn btn-primary', text: 'Save tool', onclick: saveTool })
  ]);
}

/* ── the assembly column ─────────────────────────────────────────────────

   Everything in here re-renders on every keystroke, unlike the tool fields on
   the left, because the drawing has to follow the number as it is typed. That
   is safe only because render() restores focus and caret by `data-k` — which
   is also why every input below is keyed on the stage's own uid and never on
   its index: the rows reorder. */

function assemblyOf(d) {
  if (!d.assembly) d.assembly = { stack: [], stickout: '' };
  if (!d.assembly.stack) d.assembly.stack = [];
  return d.assembly;
}

function assemblyPanel(d, g) {
  var asm = d.assembly || { stack: [], stickout: '' };
  g = g || assemblyGeom(d);

  var draw = frame('padding:var(--space-3);background:var(--color-neutral-100);display:flex;justify-content:center');
  draw.appendChild(assemblyDrawing(d, { w: 470, h: 430 }));

  var rows = el('div', { style: 'display:grid;gap:var(--space-2)' });
  (asm.stack || []).forEach(function (e, i) {
    var st = g.stages[i] || {};
    var comp = st.comp;
    var sub = comp
      ? holderKindLabel(comp.kind) + (comp.nose ? ' · ' + comp.nose : '') + ' · ' + fmt3(st.len) + ' proj'
      : 'not in the holder library any more';
    rows.appendChild(el('div', { style: 'display:flex;align-items:center;gap:var(--space-2);border-bottom:1px solid color-mix(in srgb, var(--color-text) 8%, transparent);padding-bottom:var(--space-2)' },
      el('div', { style: 'display:flex;flex-direction:column' },
        el('button', { class: 'btn btn-ghost', style: 'font-size:10px;line-height:1;padding:1px 3px', text: '▲',
          disabled: i === 0, onclick: function () { moveStage(d, i, -1); } }),
        el('button', { class: 'btn btn-ghost', style: 'font-size:10px;line-height:1;padding:1px 3px', text: '▼',
          disabled: i === asm.stack.length - 1, onclick: function () { moveStage(d, i, 1); } })
      ),
      el('div', { style: 'flex:1;min-width:0' },
        el('div', { style: 'font-size:13px;font-weight:600;color:' + (comp ? 'inherit' : 'var(--color-accent-800)'),
          text: (comp ? '' : '⚠ ') + (comp ? comp.name : 'Missing component') }),
        el('div', { class: 'text-muted', style: 'font-size:11px', text: sub })
      ),
      comp ? el('button', { class: 'btn btn-ghost', style: 'font-size:12px', text: 'Edit',
        onclick: function () { set({ dialog: { kind: 'holder', back: 'tool' }, hDraft: cloneHolder(comp), hDraftError: '' }); } }) : null,
      el('button', { class: 'btn btn-ghost', style: 'font-size:12px', text: comp ? 'Swap' : 'Pick',
        onclick: function () { set({ dialog: { kind: 'compPick', back: 'tool', replaceU: e.u } }); } }),
      el('button', { class: 'btn btn-ghost', style: 'font-size:14px', text: '×',
        onclick: function () { asm.stack = asm.stack.filter(function (x) { return x.u !== e.u; }); render(); } })
    ));
  });
  if (!asm.stack.length) {
    /* Telling someone to start with the taper without handing them one is a
       dead end — the tapers in the library go right here, with whatever the
       Holder field already says sorted to the front. */
    var picks = suggestTapers(d);
    rows.appendChild(el('p', { class: 'text-muted', style: 'font-size:12px;margin:0',
      text: picks.length
        ? 'Start with the taper — the holder that goes in the spindle. Then stack anything between it and the cutter.'
        : 'Add a taper to the holder library first — that is the holder that goes in the spindle.' }));
    if (picks.length) {
      var quick = el('div', { style: 'display:flex;flex-wrap:wrap;gap:var(--space-2)' });
      picks.slice(0, 4).forEach(function (x, i) {
        quick.appendChild(el('button', {
          class: i === 0 && x.score > 0 ? 'btn btn-primary' : 'btn btn-secondary',
          style: 'font-size:12px',
          text: x.h.name,
          onclick: function () { assemblyOf(d).stack = [{ u: uid(), ref: x.h.id }]; render(); }
        }));
      });
      rows.appendChild(quick);
      if (picks[0].score > 0) {
        rows.appendChild(el('div', { class: 'text-muted', style: 'font-size:11px',
          text: 'First one matches the Holder field.' }));
      }
    }
  }

  function numField(label, key, ph, hint) {
    return el('div', { class: 'field' },
      el('label', { text: label }),
      el('input', { class: 'input', 'data-k': 'asm-' + key, placeholder: ph, value: asm[key] == null ? '' : asm[key],
        oninput: function (e) { assemblyOf(d)[key] = e.target.value; render(); } }),
      hint ? el('div', { class: 'text-muted', style: 'font-size:11px;margin-top:3px', text: hint }) : null);
  }

  var readout = el('div', { style: 'display:grid;gap:var(--space-1);font-size:13px' });
  if (g.ok) {
    readout.appendChild(el('div', {},
      el('span', { class: 'text-muted', style: 'font-size:11px;letter-spacing:.08em;text-transform:uppercase', text: 'Gauge length ' }),
      el('b', { style: 'font-variant-numeric:tabular-nums', text: fmt3(g.gauge) }),
      el('span', { class: 'text-muted', style: 'font-size:11px', text: '  = ' + fmt3(g.holderFront) + ' holder + ' + fmt3(g.stickout) + ' stickout' })
    ));
  }
  g.warn.forEach(function (m) {
    readout.appendChild(el('div', { style: 'font-size:12px;color:var(--color-accent-800)', text: '⚠ ' + m }));
  });

  return el('div', { style: 'display:grid;gap:var(--space-3);align-content:start' },
    el('div', { class: 'text-muted', style: 'font-size:11px;letter-spacing:.12em;text-transform:uppercase', text: 'Assembly' }),
    draw,
    readout,
    rows,
    el('div', { style: 'display:flex;gap:var(--space-2);flex-wrap:wrap' },
      el('button', { class: 'btn btn-secondary', style: 'font-size:12px', text: '+ Add component',
        onclick: function () { set({ dialog: { kind: 'compPick', back: 'tool', replaceU: null } }); } }),
      asm.stack.length ? el('button', { class: 'btn btn-ghost', style: 'font-size:12px', text: 'Clear stack',
        onclick: function () { d.assembly = { stack: [], stickout: asm.stickout }; render(); } }) : null
    ),
    el('div', { style: 'display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:var(--space-3)' },
      [numField('Stickout', 'stickout', '1.500', 'Tip to the holder face.'),
       numField('Shank ⌀', 'shankDia', String(d.dia || '0.500'), 'Blank = the tool ⌀.')]
        .concat(cutterFields(d, g, numField)))
  );
}

/* A chamfer, dovetail, lollipop or T-slot cutter needs a couple of numbers a
   plain endmill does not — asking for them only when the Type calls for them
   keeps the panel from turning into a form. */
function cutterFields(d, g, numField) {
  var k = g.cut ? g.cut.kind : 'plain';
  var D = num(d.dia);
  function dflt(x) { return D > 0 ? fmt3(D * x) : ''; }
  var out = [];

  if (k === 'chamfer') {
    out.push(numField('Included angle', 'angle', '90', 'Degrees.'));
    out.push(numField('Tip flat ⌀', 'tipDia', '0.060', 'The flat on the point.'));
  } else if (k === 'dovetail') {
    out.push(numField('Included angle', 'angle', '60', 'Degrees.'));
    out.push(numField('Head height', 'headLen', dflt(0.40), 'Depth of the cutting head.'));
    out.push(numField('Neck ⌀', 'neckDia', dflt(0.60), 'Above the head.'));
  } else if (k === 'disc') {
    out.push(numField('Head height', 'headLen', dflt(0.25), 'Thickness of the disc.'));
    out.push(numField('Neck ⌀', 'neckDia', dflt(0.50), 'Behind the disc.'));
  } else if (k === 'lolli') {
    out.push(numField('Neck ⌀', 'neckDia', dflt(0.50), 'Behind the ball.'));
  } else if (k === 'face') {
    out.push(numField('Lead angle', 'lead', '45', 'Degrees. 90 = square shoulder.'));
    out.push(numField('Insert height', 'insH', dflt(0.10), 'How far up the corner the edge runs.'));
    out.push(numField('Body height', 'bodyH', dflt(0.35), 'Cutter body, tip to arbor face.'));
    out.push(numField('Arbor ⌀', 'arborDia', dflt(0.40), 'The pilot it mounts on.'));
  } else if (k === 'bull') {
    out.push(numField('Corner radius', 'cornerRad', dflt(0.15), 'On each corner.'));
    out.push(numField('Neck ⌀', 'neckDia', '', 'Only if it is necked down.'));
  } else if (k === 'drill') {
    out.push(numField('Point angle', 'angle', '118', 'Degrees included.'));
    out.push(numField('Neck ⌀', 'neckDia', '', 'Only if it is necked down.'));
  } else if (k === 'probe') {
    out.push(numField('Stylus ball ⌀', 'styDia', dflt(0.25), 'The ruby.'));
    out.push(numField('Stylus length', 'styLen', dflt(1.20), 'Body face to ball centre.'));
  } else if (k === 'reamer') {
    out.push(numField('Lead angle', 'angle', '45', 'The chamfer at the nose.'));
    out.push(numField('Neck ⌀', 'neckDia', '', 'Only if it is necked down.'));
  } else {
    out.push(numField('Neck ⌀', 'neckDia', '', 'Only if the tool is necked down.'));
  }

  if (k === 'dovetail' || k === 'disc' || k === 'lolli' || k === 'chamfer') {
    out.push(numField('Neck length', 'neckLen', '', 'Blank = up to the holder.'));
  }
  return out;
}

/* Tapers, best guess first: whatever the tool's free-text Holder field
   already names is almost always the one wanted. */
function suggestTapers(d) {
  var words = String(d.holder || '').toLowerCase().split(/[^a-z0-9.]+/).filter(function (w) { return w.length > 1; });
  return state.holders
    .filter(function (h) { return h.kind === 'taper'; })
    .map(function (h) {
      var hay = [h.name, h.taper, h.nose].join(' ').toLowerCase();
      var score = 0;
      words.forEach(function (w) { if (hay.indexOf(w) >= 0) score++; });
      return { h: h, score: score };
    })
    .sort(function (a, b) { return b.score - a.score || String(a.h.name).localeCompare(String(b.h.name)); });
}

function moveStage(d, i, dir) {
  var st = assemblyOf(d).stack;
  var j = i + dir;
  if (j < 0 || j >= st.length) return;
  var tmp = st[i]; st[i] = st[j]; st[j] = tmp;
  render();
}

/* The component picker — a second dialog over the tool dialog. state.draft is
   left alone, so coming back lands exactly where you were. */
function compPickDialog() {
  var replaceU = state.dialog.replaceU;
  var d = state.draft;
  var q = state.pickSearchH.trim().toLowerCase();
  var list = state.holders.filter(function (h) {
    return !q || [h.name, h.kind, h.taper, h.nose, h.vendor, h.partno].some(function (v) {
      return String(v || '').toLowerCase().indexOf(q) >= 0;
    });
  });
  // What the stage above hands off decides what fits — sorted to the top,
  // never hidden. Shops adapt things the library has never heard of.
  var stack = (d && d.assembly && d.assembly.stack) || [];
  var idx = replaceU ? stack.map(function (x) { return x.u; }).indexOf(replaceU) : stack.length;
  var above = idx > 0 ? holderById(stack[idx - 1].ref) : null;
  var wantMount = above ? String(above.nose || '') : '';
  list = list.slice().sort(function (a, b) {
    var fa = wantMount && String(a.nose || '') === wantMount ? 0 : 1;
    var fb = wantMount && String(b.nose || '') === wantMount ? 0 : 1;
    if (idx === 0) { fa = a.kind === 'taper' ? 0 : 1; fb = b.kind === 'taper' ? 0 : 1; }
    return fa - fb || String(a.name).localeCompare(String(b.name));
  });

  var rows = el('div', { style: 'display:grid;gap:var(--space-2);max-height:46vh;overflow:auto' });
  list.forEach(function (h) {
    rows.appendChild(el('div', { style: 'display:flex;align-items:center;gap:var(--space-3);border-bottom:1px solid color-mix(in srgb, var(--color-text) 8%, transparent);padding-bottom:var(--space-2)' },
      el('div', { style: 'flex:1;min-width:0' },
        el('div', { style: 'font-size:13px;font-weight:600', text: h.name }),
        el('div', { class: 'text-muted', style: 'font-size:11px',
          text: holderKindLabel(h.kind) + (h.taper ? ' · ' + h.taper : '') + (h.nose ? ' → ' + h.nose : '') +
            ' · ' + fmt3(compLength(h)) + ' proj' })
      ),
      el('button', { class: 'btn btn-secondary', style: 'font-size:12px', text: replaceU ? 'Use' : 'Add',
        onclick: function () {
          var asm = assemblyOf(d);
          if (replaceU) {
            asm.stack = asm.stack.map(function (x) { return x.u === replaceU ? { u: x.u, ref: h.id } : x; });
          } else {
            asm.stack = asm.stack.concat([{ u: uid(), ref: h.id }]);
          }
          set({ dialog: { kind: 'tool' }, pickSearchH: '' });
        } })
    ));
  });
  if (!list.length) {
    rows.appendChild(el('p', { class: 'text-muted', style: 'font-size:13px;margin:0', text: 'Nothing matches. Add it to the holder library first.' }));
  }

  var body = el('div', { class: 'dialog-body', style: 'display:grid;gap:var(--space-3)' },
    el('input', { class: 'input', 'data-k': 'pickSearchH', placeholder: 'Search the holder library',
      value: state.pickSearchH, oninput: function (e) { set({ pickSearchH: e.target.value }); } }),
    rows);

  return dialogShell('width:min(560px,100%)', replaceU ? 'Swap component' : 'Add a component', body, [
    el('button', { class: 'btn btn-ghost', text: 'New holder…', onclick: function () {
      set({ dialog: { kind: 'holder', back: 'compPick' }, hDraft: blankHolder(), hDraftError: '' });
    } }),
    el('button', { class: 'btn btn-secondary', text: 'Cancel', onclick: function () { set({ dialog: { kind: 'tool' }, pickSearchH: '' }); } })
  ]);
}

function saveTool() {
  var d = state.draft;
  if (!d) return;
  if (!String(d.tnum || '').trim()) {
    return set({ draftError: 'Give the tool a T-number — it is how every job refers to it.' });
  }
  var clash = state.tools.some(function (t) {
    return t.machine === d.machine && t.id !== d.id &&
      String(t.tnum).trim().toLowerCase() === String(d.tnum).trim().toLowerCase();
  });
  if (clash) return set({ draftError: d.tnum + ' is already taken in the ' + d.machine + ' sequence.' });

  if (d.removeImage) { deleteToolImage(d.removeImage); }
  var saved = cloneTool(d);
  delete saved.removeImage;
  if (saved.machine !== 'lathe') {
    var ag = assemblyGeom(saved);
    if (ag.ok) saved.gauge = fmt3(ag.gauge);
  }
  if (!saved.image) delete saved.image;

  if (d.id) {
    state.tools = state.tools.map(function (t) { return t.id === d.id ? saved : t; });
  } else {
    saved.id = uid();
    state.tools = state.tools.concat([saved]);
  }
  markTools();
  set({ dialog: null, draft: null, draftError: '' });
}

function usageDialog() {
  var tool = state.tools.filter(function (t) { return t.id === state.dialog.toolId; })[0];
  var jobs = tool ? usage(tool.id) : [];
  var table = el('table', { class: 'table' },
    el('thead', {}, el('tr', {}, ['Job / WO', 'Machine', 'Last run', ''].map(function (h) { return el('th', { text: h }); })))
  );
  var tbody = el('tbody');
  jobs.forEach(function (j) {
    tbody.appendChild(clickable(el('tr', {},
      el('td', { style: 'font-variant-numeric:tabular-nums', text: j.jobno || '(untitled)' }),
      el('td', { class: 'text-muted', text: j.machine || '—' }),
      el('td', { class: 'text-muted', style: 'font-variant-numeric:tabular-nums', text: j.lastRun || '—' }),
      el('td', { style: 'text-align:right' }, el('button', { class: 'btn btn-ghost', text: 'Open setup', onclick: function () { openJob(j.id); } }))
    ), function () { openJob(j.id); }));
  });
  table.appendChild(tbody);
  var body = el('div', { class: 'dialog-body' }, table);
  if (!jobs.length) {
    body.appendChild(el('p', { class: 'text-muted', style: 'font-size:13px;margin:var(--space-4) 0 0', text: 'This tool is not on any job yet.' }));
  }
  var title = tool ? tool.tnum + ' — used in ' + jobs.length + ' job' + (jobs.length === 1 ? '' : 's') : '';
  return dialogShell('width:min(680px,100%)', title, body, [
    el('button', { class: 'btn btn-secondary', text: 'Close', onclick: closeDialog })
  ]);
}

function conflictDialog() {
  var c = conflict || { label: 'this record' };
  var body = el('div', { class: 'dialog-body' },
    el('p', { text: c.label.charAt(0).toUpperCase() + c.label.slice(1) + ' was changed on another machine while you were editing it.' }),
    el('p', { style: 'margin:0', text: 'Keep mine overwrites their version with what is on your screen. Take theirs discards your unsaved edits and loads the copy from the folder.' })
  );
  return dialogShell('width:min(520px,100%)', 'Changed by someone else', body, [
    el('button', { class: 'btn btn-secondary', text: 'Take theirs', onclick: resolveTakeTheirs }),
    el('button', { class: 'btn btn-primary', text: 'Keep mine', onclick: resolveKeepMine })
  ]);
}

function confirmDialog() {
  var d = state.dialog;
  return dialogShell('width:min(440px,100%)', d.title, el('div', { class: 'dialog-body', text: d.body }), [
    el('button', { class: 'btn btn-secondary', text: 'Cancel', onclick: closeDialog }),
    el('button', { class: 'btn btn-primary', text: d.okLabel || 'OK', onclick: function () { if (d.action) d.action(); } })
  ]);
}

/* ══════════════════════════════════════════════════════════════════════
   Render — full rebuild, with focus and caret preserved across renders
   ══════════════════════════════════════════════════════════════════ */

var root = document.getElementById('app');

function render() {
  var active = document.activeElement;
  var key = active && active.dataset ? active.dataset.k : null;
  var selStart = null, selEnd = null;
  if (key && typeof active.selectionStart === 'number') {
    selStart = active.selectionStart; selEnd = active.selectionEnd;
  }

  /* A registry (or the holder library that hangs off the mill one) can be
     switched off while you are standing on it. */
  var reg = currentRegistry();
  if (state.view === 'tools') {
    if (!reg) state.view = 'dash'; else state.machineType = reg;
  }
  if (state.view === 'holders' && visibleRegistries().indexOf('mill') < 0) state.view = 'dash';
  if (state.view === 'jobs' && !typeByValue(state.jobType)) state.jobType = defaultType();

  var page;
  if (state.view === 'tools') page = viewTools();
  else if (state.view === 'holders') page = viewHolders();
  else if (state.view === 'jobs') page = viewJobs();
  else if (state.view === 'job') page = viewJob();
  else if (state.view === 'settings') page = viewSettings();
  else page = viewDash();

  var main = el('main', { style: 'max-width:1440px;margin:0 auto;padding:var(--space-8) var(--space-6) 80px' }, page);
  var shell = el('div', { style: 'min-height:100vh' }, header(), main);

  if (state.dialog) {
    var dlg = state.dialog.kind === 'tool' ? toolDialog()
      : state.dialog.kind === 'holder' ? holderDialog()
      : state.dialog.kind === 'compPick' ? compPickDialog()
      : state.dialog.kind === 'usage' ? usageDialog()
      : state.dialog.kind === 'image' ? imageDialog()
      : state.dialog.kind === 'conflict' ? conflictDialog()
      : confirmDialog();
    if (dlg) shell.appendChild(dlg);
  }

  root.textContent = '';
  root.appendChild(shell);

  if (key) {
    var next = root.querySelector('[data-k="' + key + '"]');
    if (next) {
      next.focus();
      if (selStart !== null && typeof next.setSelectionRange === 'function') {
        try { next.setSelectionRange(selStart, selEnd); } catch (e) { /* type=date etc. */ }
      }
    }
  }
}

/* ══════════════════════════════════════════════════════════════════════
   Boot
   ══════════════════════════════════════════════════════════════════ */

var cached = loadLocal();
if (cached) {
  state.tools = cached.tools || [];
  state.jobs = cached.jobs || [];
  state.machines = cached.machines || SEED.machines.slice();
  state.holders = cached.holders || DEFAULT_HOLDERS.slice();
  state.settings = Object.assign({}, DEFAULT_SETTINGS, cached.settings || {});
}

render();
restoreFolder();

window.addEventListener('beforeunload', function () {
  if (flushTimer) { clearTimeout(flushTimer); flushNow(); }
});

/* Coming back to the tab should show the floor as it is now, not as it was
   when you walked away — cheaper and faster than waiting for the next poll. */
window.addEventListener('focus', function () { if (store.connected) pollDisk(); });
document.addEventListener('visibilitychange', function () {
  if (!document.hidden && store.connected) pollDisk();
});

})();
</script>
</body>
