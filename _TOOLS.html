<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tool Master — machine shop tool registry</title>
<style>
/* ── Industry design system (inlined from _ds/.../styles.css) ─────────────
   Fonts fall back to the system stack so the page works with no network. */
:root {
  --color-bg: #f2f2f3;
  --color-surface: #e9e9ea;
  --color-text: #1d1f20;
  --color-accent: #5980a6;
  --color-accent-2: #728fab;
  --color-divider: color-mix(in srgb, #1d1f20 16%, transparent);

  --color-neutral-100: #f5f5f8;
  --color-neutral-200: #e7e7ea;
  --color-neutral-300: #d4d4d7;
  --color-neutral-400: #b7b7ba;
  --color-neutral-500: #98989b;
  --color-neutral-600: #7a7a7d;
  --color-neutral-700: #5d5d60;
  --color-neutral-800: #424244;
  --color-neutral-900: #2b2b2d;

  --color-accent-100: #eef6ff;
  --color-accent-200: #d6ebff;
  --color-accent-300: #b5d9fd;
  --color-accent-400: #94bce3;
  --color-accent-500: #749dc4;
  --color-accent-600: #597ea3;
  --color-accent-700: #416180;
  --color-accent-800: #2c455d;
  --color-accent-900: #1d2d3d;

  --font-heading: "Barlow Condensed", "Oswald", "Arial Narrow", system-ui, sans-serif;
  --font-heading-weight: 600;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;

  --space-1: 3.4px;
  --space-2: 6.8px;
  --space-3: 10.2px;
  --space-4: 13.6px;
  --space-6: 20.4px;
  --space-8: 27.2px;

  --radius-sm: 2px;
  --radius-md: 4px;
  --radius-lg: 7px;

  --shadow-sm: 0 1px 2px color-mix(in srgb, #2b2b2d 14%, transparent);
  --shadow-md: 0 3px 10px color-mix(in srgb, #2b2b2d 16%, transparent);
  --shadow-lg: 0 12px 32px color-mix(in srgb, #2b2b2d 22%, transparent);
}

*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400;
  background: var(--color-bg); color: var(--color-text); font-family: var(--font-body);
}
h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);
}
h1 { font-size: 42px; } h2 { font-size: 32px; } h3 { font-size: 25px; }
h4 { font-size: 20px; } h5 { font-size: 16px; }
h6 { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; }
p { margin: 0 0 var(--space-3); }
a { color: var(--color-accent); text-underline-offset: 3px; }
a:hover { color: var(--color-accent-700); }
.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }

.blueprint { position: relative; border: 1px solid var(--color-divider); border-radius: 0; }
.blueprint > .corner {
  position: absolute; width: 11px; height: 11px;
  color: color-mix(in srgb, var(--color-text) 55%, transparent);
}
.blueprint > .corner::before, .blueprint > .corner::after { content: ""; position: absolute; background: currentColor; }
.blueprint > .corner::before { left: 5px; top: 0; width: 1px; height: 100%; }
.blueprint > .corner::after  { top: 5px; left: 0; width: 100%; height: 1px; }
.blueprint > .corner.tl { top: -6px; left: -6px; }
.blueprint > .corner.tr { top: -6px; right: -6px; }
.blueprint > .corner.bl { bottom: -6px; left: -6px; }
.blueprint > .corner.br { bottom: -6px; right: -6px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  cursor: pointer; text-decoration: none;
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 14px; line-height: 1.2; color: var(--color-text);
  background: transparent; border: 1px solid var(--color-divider);
  padding: var(--space-2) calc(var(--space-3) * 1.2);
  border-radius: 0;
}
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--color-accent); color: var(--color-bg); border-color: var(--color-accent); }
.btn-primary:hover { background: var(--color-accent-600); }
.btn-primary:active { background: var(--color-accent-700); }
.btn-secondary { border-color: var(--color-divider); }
.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }
.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); border-color: transparent; }
.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }
.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }

.field > label {
  display: block; font-size: 12px; margin-bottom: 5px;
  color: color-mix(in srgb, var(--color-text) 70%, transparent);
}
.input {
  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;
  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);
  background: var(--color-surface);
  border: 1px solid var(--color-divider); border-radius: 0;
}
.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }
.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }
textarea.input { min-height: 90px; resize: vertical; }

.card {
  display: flex; flex-direction: column; gap: var(--space-2);
  padding: var(--space-3); border-radius: 0;
  background: transparent; border: 1px solid var(--color-divider);
}
.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }
.card-meta {
  display: flex; align-items: center; gap: 6px; font-size: 11px;
  color: color-mix(in srgb, var(--color-text) 50%, transparent);
}

.tag {
  display: inline-flex; align-items: center; font-size: 11px;
  letter-spacing: 0.02em; padding: 3px 10px; border-radius: 0;
}
.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }

.nav { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-3) var(--space-4); }
.nav-brand { font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 18px; margin-right: auto; }
.nav a { color: inherit; text-decoration: none; font-size: 14px; cursor: pointer; }
.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }

.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th {
  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  color: color-mix(in srgb, var(--color-text) 60%, transparent);
  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);
}
.table td { padding: var(--space-2); border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent); }
.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }

.dialog-backdrop {
  position: fixed; inset: 0; display: grid; place-items: center; z-index: 50;
  padding: var(--space-4);
  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);
}
.dialog {
  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);
  padding: var(--space-4); border-radius: 0;
  background: var(--color-bg); border: 1px solid var(--color-divider); box-shadow: var(--shadow-lg);
}
.dialog-title { font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 20px; }
.dialog-body { font-size: 14px; opacity: 0.85; }
.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }

/* Whole rows and cards are click targets; the buttons inside them still win. */
.clickable { cursor: pointer; }
.card.clickable:hover { border-color: var(--color-accent); }
.card.clickable:hover .card-kicker { color: var(--color-accent-700); }
tr.clickable:hover { background: color-mix(in srgb, var(--color-accent) 8%, transparent); }

/* ── file-sync chrome ─────────────────────────────────────────────────── */
.sync { display: flex; align-items: center; gap: var(--space-3); }
.sync-dot { width: 8px; height: 8px; flex: none; background: var(--color-neutral-500); }
.sync-dot.ok { background: var(--color-accent); }
.sync-dot.warn { background: #b8863b; }
.sync-dot.err { background: #a4443a; }
.sync-text { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 55%, transparent); }
.banner {
  font-size: 13px; padding: var(--space-2) var(--space-6);
  background: color-mix(in srgb, var(--color-accent) 12%, transparent);
  border-bottom: 1px solid var(--color-divider);
}
</style>
</head>

(function () {

/* The kinds of machine on the floor. Editable in Settings: hide one you do
   not run, or add your own (EDM, grinder, saw…). `tooling` says which tool
   registry that kind's jobs pick from — a mill-turn uses both.
   `value` doubles as the job folder name under jobs/. */
var DEFAULT_MACHINE_TYPES = [
  { value: 'mill', label: 'Mill', tooling: 'mill', builtin: true },
  { value: 'lathe', label: 'Lathe', tooling: 'lathe', builtin: true },
  { value: 'millturn', label: 'Mill-turn', tooling: 'both', builtin: true, hidden: true }
];

function machineTypes() {
  var list = state.settings && state.settings.machineTypes;
  return (list && list.length) ? list : DEFAULT_MACHINE_TYPES;
}
function visibleTypes() {
  return machineTypes().filter(function (t) { return !t.hidden; });
}
function typeByValue(v) {
  return machineTypes().filter(function (t) { return t.value === v; })[0] || null;
}
function typeLabel(v) {
  var t = typeByValue(v);
  return t ? t.label : (v ? v.charAt(0).toUpperCase() + v.slice(1) : 'Mill');
}
function toolingFor(v) {
  var t = typeByValue(v);
  return t ? (t.tooling || 'mill') : 'mill';
}
function defaultType() {
  var v = visibleTypes()[0] || machineTypes()[0];
  return v ? v.value : 'mill';
}
function jobsPageTitle(t) { return typeLabel(t) + ' jobs'; }

/* A registry is keyed by tooling, not by machine type — several types can
   share one, and a mill-turn needs both. Untick every type that uses a
   registry and the registry goes with them, out of the nav and off the
   dashboard, instead of hanging around because it was hardcoded. */
function visibleRegistries() {
  var has = {};
  visibleTypes().forEach(function (t) {
    var g = t.tooling || 'mill';
    if (g === 'both') { has.mill = true; has.lathe = true; } else { has[g] = true; }
  });
  var out = [];
  if (has.mill) out.push('mill');
  if (has.lathe) out.push('lathe');
  return out;
}

function registryLabel(g) {
  var t = visibleTypes().filter(function (x) { return (x.tooling || 'mill') === g; })[0];
  return t ? t.label : (g === 'lathe' ? 'Lathe' : 'Mill');
}

/* Whatever is on screen has to be something still switched on. */
function currentRegistry() {
  var vis = visibleRegistries();
  if (!vis.length) return null;
  return vis.indexOf(state.machineType) >= 0 ? state.machineType : vis[0];
}

   ══════════════════════════════════════════════════════════════════ */

};

var TAPER_LIST = ['CAT50', 'CAT40', 'BT30', 'BT40', 'HSK63A'];

/* Shipped so the feature is usable the moment it is opened. Nominal catalogue
   sizes — every one of them is editable, and a shop should correct them
   against what is actually in the crib. */
var DEFAULT_HOLDERS = [
  { id: 'h_c50er32', kind: 'taper', name: 'CAT50 ER32 x 4.00', taper: 'CAT50', nose: 'ER32', gripMin: 0.75,
    segs: [{ len: 0.75, dTop: 3.875, dBot: 3.875 }, { len: 2.50, dTop: 2.500, dBot: 1.650 }, { len: 0.75, dTop: 1.650, dBot: 1.180 }] },
  { id: 'h_c50er32l', kind: 'taper', name: 'CAT50 ER32 x 6.00', taper: 'CAT50', nose: 'ER32', gripMin: 0.75,
    segs: [{ len: 0.75, dTop: 3.875, dBot: 3.875 }, { len: 4.50, dTop: 2.500, dBot: 1.650 }, { len: 0.75, dTop: 1.650, dBot: 1.180 }] },
  { id: 'h_c50er16', kind: 'taper', name: 'CAT50 ER16 x 3.00', taper: 'CAT50', nose: 'ER16', gripMin: 0.50,
    segs: [{ len: 0.75, dTop: 3.875, dBot: 3.875 }, { len: 1.65, dTop: 2.000, dBot: 1.000 }, { len: 0.60, dTop: 1.000, dBot: 0.700 }] },
  { id: 'h_c50er40', kind: 'taper', name: 'CAT50 ER40 x 4.00', taper: 'CAT50', nose: 'ER40', gripMin: 1.00,
    segs: [{ len: 0.75, dTop: 3.875, dBot: 3.875 }, { len: 2.35, dTop: 2.900, dBot: 2.150 }, { len: 0.90, dTop: 2.150, dBot: 1.570 }] },
  { id: 'h_c50sf50', kind: 'taper', name: 'CAT50 shrink fit 0.500 x 4.50', taper: 'CAT50', nose: '0.500 shrink', gripMin: 1.00,
    segs: [{ len: 0.75, dTop: 3.875, dBot: 3.875 }, { len: 2.75, dTop: 2.000, dBot: 1.100 }, { len: 1.00, dTop: 1.100, dBot: 0.790 }] },
  { id: 'h_c50sl75', kind: 'taper', name: 'CAT50 side lock 0.750 x 3.00', taper: 'CAT50', nose: '0.750 Weldon', gripMin: 1.00,
    segs: [{ len: 0.75, dTop: 3.875, dBot: 3.875 }, { len: 2.25, dTop: 1.750, dBot: 1.750 }] },
  { id: 'h_c50shl', kind: 'taper', name: 'CAT50 shell mill arbor 1.00 x 2.50', taper: 'CAT50', nose: '1.000 shell',
    segs: [{ len: 0.75, dTop: 3.875, dBot: 3.875 }, { len: 1.40, dTop: 2.500, dBot: 2.500 }, { len: 0.35, dTop: 1.000, dBot: 1.000 }] },
  { id: 'h_ext32', kind: 'ext', name: 'ER32 extension x 3.00', nose: 'ER32', gripMin: 0.75,

  { id: 'h_ext16', kind: 'ext', name: 'ER16 extension x 2.50', nose: 'ER16', gripMin: 0.50,
    segs: [{ len: 1.90, dTop: 1.000, dBot: 1.000 }, { len: 0.60, dTop: 1.000, dBot: 0.700 }] }
];

var DEFAULT_SETTINGS = {
  shopName: 'Machine shop',
  machineTypes: null,      // null = the built-in three; Settings replaces it

var SEED = {
  machines: [
    { id: 'm1', name: 'Mazak 6000', type: 'mill' },

    { id: 't3', machine: 'mill', tnum: 'T103', desc: '1/4-20 spiral flute tap', type: 'Tap', dia: '0.250', flutes: '3', foc: '1.000', material: 'HSS-E, TiN', holder: 'Tension/comp', vendor: 'Emuge', partno: 'B0512300' },
