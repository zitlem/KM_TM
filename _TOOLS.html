/* ══════════════════════════════════════════════════════════════════════
   Small helpers
   ══════════════════════════════════════════════════════════════════ */

function uid() { return 'x' + Math.random().toString(36).slice(2, 9); }

/* Today in the YYYY-MM-DD an <input type="date"> expects, in local time —
   toISOString() would hand back yesterday for anyone west of UTC. */
function today() {
  var d = new Date();
  var pad = function (n) { return (n < 10 ? '0' : '') + n; };
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}

function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c];
  });
}

function slug(s) {
  return String(s == null ? '' : s).trim()
    .replace(/[^A-Za-z0-9._-]+/g, '-')
    .replace(/^[-.]+|-+$/g, '')
    .slice(0, 64);
}

/* el('div', {class:'x', style:'…', text:'…', onclick:fn}, child, child…) */
function el(tag, attrs) {
  var node = document.createElement(tag);
  attrs = attrs || {};
  Object.keys(attrs).forEach(function (k) {
    var v = attrs[k];
    if (v === null || v === undefined || v === false) return;
    if (k === 'text') { node.textContent = v; return; }
    if (k === 'class') { node.className = v; return; }
    if (k === 'style') { node.setAttribute('style', v); return; }
    if (k === 'value') { node.value = v; return; }
    if (k === 'checked' || k === 'disabled') { node[k] = !!v; return; }
    if (k.slice(0, 2) === 'on') { node.addEventListener(k.slice(2), v); return; }
    node.setAttribute(k, v);
  });
  for (var i = 2; i < arguments.length; i++) {
    var kid = arguments[i];
    if (kid === null || kid === undefined || kid === false) continue;
    if (Array.isArray(kid)) {
      kid.forEach(function (c) { if (c) node.appendChild(c); });
    } else if (typeof kid === 'string' || typeof kid === 'number') {
      node.appendChild(document.createTextNode(String(kid)));
    } else {
      node.appendChild(kid);
    }
  }
  return node;
}

/* Make a row or card open something on click. Clicks that land on a control
   inside it — Delete, a note field, the photo link — are left alone. */
function clickable(node, fn) {
  node.classList.add('clickable');
  node.addEventListener('click', function (e) {
    if (e.target.closest('button, a, input, select, textarea, label')) return;
    fn();
  });
  return node;
}

/* the four blueprint registration marks */
function corners() {
  return ['tl', 'tr', 'bl', 'br'].map(function (c) { return el('i', { class: 'corner ' + c }); });
}

function frame(styleStr) {
  var box = el('div', { class: 'blueprint', style: styleStr || '' });
  corners().forEach(function (c) { box.appendChild(c); });
  return box;
}

function select(attrs, options, value) {
  var s = el('select', attrs);
  options.forEach(function (o) {
    var opt = typeof o === 'string' ? { value: o, label: o } : o;
    s.appendChild(el('option', { value: opt.value, text: opt.label }));
  });
  s.value = value == null ? '' : value;
  return s;
}

/* ══════════════════════════════════════════════════════════════════════
   IndexedDB — holds the directory handle across launches
   ══════════════════════════════════════════════════════════════════ */

var idb = {
  open: function () {
    return new Promise(function (resolve, reject) {
      var req = indexedDB.open('toolmaster', 1);
      req.onupgradeneeded = function () { req.result.createObjectStore('kv'); };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
  },
  get: function (key) {
    return idb.open().then(function (db) {
      return new Promise(function (resolve, reject) {
        var r = db.transaction('kv', 'readonly').objectStore('kv').get(key);
        r.onsuccess = function () { resolve(r.result); };
        r.onerror = function () { reject(r.error); };
      });
    });
  },
  set: function (key, val) {
    return idb.open().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction('kv', 'readwrite');
        tx.objectStore('kv').put(val, key);
        tx.oncomplete = function () { resolve(); };
        tx.onerror = function () { reject(tx.error); };
      });
    });
  },
  del: function (key) {
    return idb.open().then(function (db) {
      return new Promise(function (resolve) {
        var tx = db.transaction('kv', 'readwrite');
        tx.objectStore('kv').delete(key);
        tx.oncomplete = function () { resolve(); };
      });
    });
  }
};

/* ══════════════════════════════════════════════════════════════════════
   File-system store
   ══════════════════════════════════════════════════════════════════ */

var FS_SUPPORTED = typeof window.showDirectoryPicker === 'function';

var store = {
  dir: null,          // FileSystemDirectoryHandle
  connected: false,   // handle present AND permission granted
  name: '',
  lastSync: null,     // last time we wrote
  lastRemote: null,   // last time the folder handed us someone else's change
  error: ''
};

function stripPrivate(key, value) { return key.charAt(0) === '_' ? undefined : value; }

/* A file's "signature" — modified time plus size. Any edit from any machine
   changes it, so comparing signatures tells us whether the copy on disk is
   still the one we read. Cheap enough to poll a whole shop folder with. */
function sigOf(file) { return file.lastModified + ':' + file.size; }

/* {data, sig} for a JSON file, or null when it does not exist yet. */
async function readJSONMeta(dirHandle, name) {
  var fh;
  try {
    fh = await dirHandle.getFileHandle(name);
  } catch (e) {
    if (e && e.name === 'NotFoundError') return null;
    throw e;
  }
  var file = await fh.getFile();
  var text = await file.text();
  if (!text.trim()) return null;
  return { data: JSON.parse(text), sig: sigOf(file) };
}

async function readJSON(dirHandle, name) {
  var m = await readJSONMeta(dirHandle, name);
  return m ? m.data : null;
}

async function statSig(dirHandle, name) {
  try {
    var fh = await dirHandle.getFileHandle(name);
    return sigOf(await fh.getFile());
  } catch (e) {
    if (e && e.name === 'NotFoundError') return null;
    throw e;
  }
}

/* Writes and returns the new signature, so our own write is never mistaken
   for somebody else's. */
async function writeOnce(dirHandle, name, text) {
  var fh = await dirHandle.getFileHandle(name, { create: true });
  var w = await fh.createWritable();
  await w.write(text);
  await w.close();
  return sigOf(await fh.getFile());
}

/* Chrome does not write the file in place: it writes a temporary "name.crswap"
   next to it and renames it at close. A sync client — OneDrive, Dropbox,
   Google Drive — that sweeps that scratch file up mid-write makes close()
   fail with NotFoundError even though the folder is perfectly fine. It is a
   race, so a second attempt a moment later usually lands. */
async function writeFile(dirHandle, name, text) {
  try {
    return await writeOnce(dirHandle, name, text);
  } catch (e) {
    if (!e || e.name !== 'NotFoundError') throw e;
    await new Promise(function (r) { setTimeout(r, 250); });
    return writeOnce(dirHandle, name, text);
  }
}

function writeJSON(dirHandle, name, data) {
  return writeFile(dirHandle, name, JSON.stringify(data, stripPrivate, 2) + '\n');
}

/* ── tool photos ─────────────────────────────────────────────────────── */

var IMG_MAX_PX = 1400;
var imgCache = {};    // file name -> object URL

/* Shop phones take 4000px photos; a tool crib does not need them. Scaling to
   1400px keeps the folder small enough to sit on a share and to survive in
   localStorage when no folder is connected. */
function fileToJpegDataUrl(file) {
  return new Promise(function (resolve, reject) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      var scale = Math.min(1, IMG_MAX_PX / Math.max(img.width, img.height));
      var c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width * scale));
      c.height = Math.max(1, Math.round(img.height * scale));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('That file is not an image the browser can read.')); };
    img.src = url;
  });
}

function dataUrlToBlob(dataUrl) {
  var bin = atob(dataUrl.split(',')[1]);
  var bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type: 'image/jpeg' });
}

function imageNameFor(tool) { return (slug(tool.tnum) || tool.id) + '-' + tool.id + '.jpg'; }

/* The photo as something an <img> can show: the freshly picked one, or the
   file in the folder, loaded once and cached. */
async function imageUrl(tool) {
  if (tool.imageData) return tool.imageData;
  if (!tool.image) return null;
  if (imgCache[tool.image]) return imgCache[tool.image];
  if (!store.connected || !store.dir) return null;
  try {
    var dir = await store.dir.getDirectoryHandle('tools', { create: true });
    var fh = await dir.getFileHandle(tool.image);
    var url = URL.createObjectURL(await fh.getFile());
    imgCache[tool.image] = url;
    return url;
  } catch (e) { return null; }
}

async function deleteToolImage(name) {
  if (imgCache[name]) { URL.revokeObjectURL(imgCache[name]); delete imgCache[name]; }
  if (!store.connected || !store.dir || !name) return;
  try {
    var dir = await store.dir.getDirectoryHandle('tools', { create: true });
    await dir.removeEntry(name);
  } catch (e) { /* already gone */ }
}

async function permissionState() {
  if (!store.dir || !store.dir.queryPermission) return 'granted';
  return store.dir.queryPermission({ mode: 'readwrite' });
}

/* Restore a remembered folder. Loads with zero clicks when the browser has
   kept the grant; otherwise leaves the Sync button in the "needs a click"
   state so one press can call requestPermission() from a user gesture. */
async function restoreFolder() {
  if (!FS_SUPPORTED) return;
  var handle;
  try { handle = await idb.get('dataDir'); } catch (e) { return; }
  if (!handle) return;
  store.dir = handle;
  store.name = handle.name;
  var perm = await permissionState();
  if (perm === 'granted') {
    await loadFromDisk();
  } else {
    store.connected = false;
    render();
  }
}

async function connectFolder() {
  try {
    var handle = await window.showDirectoryPicker({ id: 'toolmaster-data', mode: 'readwrite' });
    store.dir = handle;
    store.name = handle.name;
    store.error = '';
    idb.set('dataDir', handle).catch(function () { /* folder just won't be remembered */ });
    await loadFromDisk();
  } catch (e) {
    if (e && e.name === 'AbortError') return;      // user closed the picker
    if (folderMissing(e)) return handleMissing(e, 'picking the folder');
    store.error = e && e.message ? e.message : String(e);
    render();
  }
}

/* Chrome remembers the folder but not the permission, and it will only
   re-prompt for it under conditions it does not advertise — after a restart,
   or once the site's file-access setting has been cleared, requestPermission
   just resolves 'prompt' or throws, and the click looks like it did nothing.
   So: ask, and if the answer is anything but yes, say so and offer the one
   thing that always works — picking the folder again from a fresh click. */
/* A moved, renamed or unmounted folder comes back as a bare NotFoundError —
   "A requested file or directory could not be found at the time an operation
   was processed" — which tells a machinist nothing. Say what happened. */
function folderMissing(e) { return !!(e && e.name === 'NotFoundError'); }

function folderLabel() { return store.name ? '"' + store.name + '"' : 'the data folder'; }

function noteFolderGone() {
  store.connected = false;
  store.error = 'The data folder ' + folderLabel() +
    ' is not there any more — it was moved or renamed, or the share it lives on is not mounted. ' +
    'Your work is safe in this browser; reconnect once the folder is back.';
}

/* Can we still list the folder itself? A NotFoundError from somewhere deeper
   — a job folder deleted on another machine, a photo removed under us — does
   NOT mean the data folder has gone, and saying so sends people hunting for a
   folder that is sitting right where they left it. Ask before claiming. */
/* 'ok' the folder lists fine, 'gone' it is really not there, 'noperm' we are
   simply not allowed to look — which is NOT the same as gone, and saying so
   sends people hunting for a folder sitting right where they left it. */
async function probeFolder() {
  if (!store.dir || !store.dir.values) return 'noperm';
  try {
    for await (var e of store.dir.values()) { break; }
    return 'ok';
  } catch (err) {
    return err && err.name === 'NotFoundError' ? 'gone' : 'noperm';
  }
}

async function handleMissing(e, where) {
  var detail = ' [' + (where || 'folder') + ': ' + ((e && e.name) || 'Error') +
    (e && e.message ? ' — ' + e.message : '') + ']';
  if (window.console) console.warn('Tool Master folder problem at ' + where, e);
  var probe = await probeFolder();
  if (probe === 'ok' && where === 'writing') {
    store.error = 'Could not write to ' + folderLabel() + ', though the folder itself is fine. This is almost ' +
      'always a sync client (OneDrive, Dropbox, Google Drive) deleting the temporary file Chrome writes through. ' +
      'Pause syncing on that folder, or keep the data folder on a plain local disk or a network share instead. ' +
      'Nothing is lost — everything is held here and will write out once the folder accepts it.' + detail;
  } else if (probe === 'ok') {
    store.error = 'Something inside ' + folderLabel() + ' could not be read — a file or job folder was ' +
      'renamed or deleted while the app was open. The folder itself is fine and your work is safe; ' +
      'press Sync to re-read it.' + detail;
  } else if (probe === 'gone') {
    noteFolderGone();
    store.error += detail;
  } else {
    store.connected = false;
    store.error = 'This browser will not let the app into ' + folderLabel() + ' right now. ' +
      'Press Sync and choose the folder again — that always restores access. Your work is safe here meanwhile.' + detail;
  }
  render();
}

async function grantAndLoad() {
  if (!store.dir) return connectFolder();
  var perm = 'prompt';
  try {
    perm = await store.dir.requestPermission({ mode: 'readwrite' });
  } catch (e) {
    if (folderMissing(e)) { await handleMissing(e, 'asking for access'); return askRepick('missing'); }
    perm = 'error';
    store.error = 'Could not ask for folder access: ' + (e && e.message ? e.message : String(e));
  }
  if (perm === 'granted') {
    store.error = '';
    await loadFromDisk();
    // Permission alone is not a reconnection — if the load still failed, the
    // click has to end somewhere the user can act, not just a banner.
    if (!store.connected) askRepick('');
    return;
  }
  askRepick(perm === 'denied' ? 'declined' : '');
}

function askRepick(reason) {
  var name = store.name ? '"' + store.name + '"' : 'the data folder';
  var body;
  if (reason === 'missing') {
    body = name + ' is not where it was — moved, renamed, or on a share that is not mounted right now. ' +
      'Put it back or mount the share, then choose it again. Nothing is lost in the meantime: everything ' +
      'you have done is still here in this browser and gets written out when it reconnects.';
  } else if (reason === 'declined') {
    body = 'Without access to ' + name + ' the app keeps working, but only in this browser. Choose the folder again to reconnect it.';
  } else {
    body = 'This browser remembers ' + name + ' but not the permission to it, and it will not always ask again on its own. ' +
      'Choose the same folder and everything reconnects — nothing is lost either way.';
  }
  set({ dialog: {
    kind: 'confirm',
    title: reason === 'declined' ? 'Folder access was declined'
      : reason === 'missing' ? 'The data folder has moved' : 'Pick the data folder again',
    body: body,
    okLabel: 'Choose folder…',
    // Opening the picker from this click keeps the user gesture Chrome wants.
    action: function () { state.dialog = null; state.draft = null; connectFolder(); }
  } });
}

/* Signatures of every file as we last saw it. The difference between "this
   changed" and "we changed it" is the whole basis of the sharing model. */
var seen = { tools: null, machines: null, settings: null, holders: null, jobs: {}, dirs: {} };

/* One pass over the folder: the three top-level files plus every job dir.
   In light mode (used by the poll) a file whose signature still matches is
   never actually read — on a network share that is the difference between
   listing the folder and pulling every job across the wire twice a minute. */
async function scanDisk(light) {
  var root = store.dir;
  async function top(name, prev) {
    if (light) {
      var sig = await statSig(root, name);
      if (sig !== null && sig === prev) return { sig: sig, unchanged: true };
    }
    return readJSONMeta(root, name);
  }
  var scan = {
    tools: await top('tools.json', seen.tools),
    machines: await top('machines.json', seen.machines),
    settings: await top('settings.json', seen.settings),
    holders: await top('holders.json', seen.holders),
    jobs: [], warnings: 0
  };
  var jobsDir;
  try {
    jobsDir = await root.getDirectoryHandle('jobs', { create: true });
  } catch (e) {
    // The registries live in the top-level files and do not need jobs/ — a
    // read-only folder or a share that will not take a new directory should
    // cost you the job list, not the whole connection.
    scan.jobsError = (e && e.name ? e.name : 'Error') + (e && e.message ? ' — ' + e.message : '');
    return scan;
  }

  /* side === null means a job folder sitting straight under jobs/ — the old
     flat layout. Those are read, then moved into their type's folder. */
  async function scanJobsIn(dirHandle, side, skip) {
    for await (var entry of dirHandle.values()) {
      if (entry.kind !== 'directory') continue;
      if (skip && skip[entry.name]) continue;
      var path = (side ? side + '/' : '') + entry.name;
      try {
        var known = seen.dirs[path];
        if (light && known) {
          var s = await statSig(entry, 'job.json');
          if (s !== null && s === known.sig) { scan.jobs.push({ sig: s, id: known.id, unchanged: true }); continue; }
        }
        var m = await readJSONMeta(entry, 'job.json');
        if (m && m.data && m.data.id) {
          m.data._dir = entry.name;
          m.data._side = side;
          m.dir = path;
          m.legacy = side === null;
          scan.jobs.push(m);
        } else scan.warnings++;
      } catch (e) { scan.warnings++; }
    }
  }

  /* Anything under jobs/ that does not itself hold a job.json is a machine-type
     folder — including types added on somebody else's machine. */
  var sides = {};
  for await (var top of jobsDir.values()) {
    if (top.kind !== 'directory') continue;
    if ((await statSig(top, 'job.json')) === null) sides[top.name] = true;
  }
  await scanJobsIn(jobsDir, null, sides);
  var names = Object.keys(sides);
  for (var si = 0; si < names.length; si++) {
    await scanJobsIn(await jobsDir.getDirectoryHandle(names[si]), names[si]);
  }
  return scan;
}

/* Remember which directory holds which job, so the light scan can tell an
   untouched job from a missing one without opening it. */
function noteDir(dirName, id, sig) {
  Object.keys(seen.dirs).forEach(function (d) { if (seen.dirs[d].id === id && d !== dirName) delete seen.dirs[d]; });
  if (dirName) seen.dirs[dirName] = { id: id, sig: sig };
}

function sortJobs() {
  state.jobs.sort(function (a, b) {
    return String(a.created || '').localeCompare(String(b.created || '')) ||
           String(a._dir || '').localeCompare(String(b._dir || ''));
  });
}

/* Read the whole folder into memory. Seeds an empty folder from whatever the
   browser was holding (or from SEED) so a fresh pick produces a full tree. */
async function loadFromDisk() {
  try {
    var root = store.dir;
    var scan = await scanDisk();

    if (scan.tools === null && scan.machines === null) {
      // Empty folder — hand it everything we have and write it out.
      store.connected = true;
      markAllDirty();
      await flushNow();
      store.lastSync = new Date();
      startPolling();
      render();
      return;
    }

    /* A file that is not on disk means "we have not written it yet", never
       "the shop has no tools". A folder where the first write failed part way
       through has machines.json but no tools.json, and reading that as an
       empty registry throws the crib away. Keep what we have and write it. */
    state.tools = scan.tools ? scan.tools.data : state.tools;
    state.machines = scan.machines ? scan.machines.data : state.machines;
    state.settings = Object.assign({}, DEFAULT_SETTINGS, scan.settings ? scan.settings.data : state.settings);
    state.holders = scan.holders ? scan.holders.data : state.holders;
    state.jobs = scan.jobsError ? state.jobs : scan.jobs.map(function (m) { return m.data; });
    sortJobs();

    seen = { tools: scan.tools && scan.tools.sig, machines: scan.machines && scan.machines.sig,
             settings: scan.settings && scan.settings.sig, holders: scan.holders && scan.holders.sig,
             jobs: {}, dirs: {} };
    scan.jobs.forEach(function (m) { seen.jobs[m.data.id] = m.sig; noteDir(m.dir, m.data.id, m.sig); });

    if (state.jobId && !state.jobs.some(function (j) { return j.id === state.jobId; })) {
      state.jobId = null;
      if (state.view === 'job') state.view = 'jobs';
    }

    store.connected = true;
    store.error = scan.jobsError
      ? 'Connected, but the jobs folder could not be opened (' + scan.jobsError + '). Tools and holders are syncing; jobs are staying in this browser for now.'
      : scan.warnings ? scan.warnings + ' job folder(s) skipped — unreadable job.json' : '';
    store.lastSync = new Date();
    dirty = { tools: false, machines: false, settings: false, holders: false, jobs: {} };
    // Anything the folder is missing is ours to write, not ours to forget.
    if (!scan.tools) dirty.tools = true;
    if (!scan.machines) dirty.machines = true;
    if (!scan.settings) dirty.settings = true;
    if (!scan.holders) dirty.holders = true;
    if (dirty.tools || dirty.machines || dirty.settings || dirty.holders) scheduleFlush();

    // Folders written before the mill/lathe split get rewritten into their
    // side folder on the next flush, and the flat one is removed.
    var legacy = scan.jobs.filter(function (m) { return m.legacy; });
    if (legacy.length) {
      legacy.forEach(function (m) { dirty.jobs[m.data.id] = true; });
      scheduleFlush();
    }
    saveLocal();
    startPolling();
    render();
  } catch (e) {
    if (folderMissing(e)) return handleMissing(e, 'reading the folder');
    store.connected = false;
    store.error = e && e.message ? e.message : String(e);
    render();
  }
}

/* ── watching the folder for other people's writes ───────────────────── */

var POLL_MS = 10000;
var pollTimer = null;

function startPolling() {
  if (pollTimer) return;
  pollTimer = setInterval(function () {
    if (document.hidden || !store.connected) return;
    pollDisk();
  }, POLL_MS);
}

function pollDisk() {
  flushChain = flushChain.then(async function () {
    if (!store.connected || !store.dir) return;
    try {
      var scan = await scanDisk(true);
      if (mergeScan(scan)) {
        store.lastRemote = new Date();
        saveLocal();
        render();
      }
    } catch (e) {
      if (folderMissing(e)) { await handleMissing(e, 'the folder watch'); }
      else if (e && e.name === 'NotAllowedError') { store.connected = false; render(); }
    }
  });
  return flushChain;
}

/* Fold what is on disk into memory. Anything we have unsaved local edits to
   is left alone — the write guard in flushNow() raises that as a conflict
   instead, so a half-typed note is never overwritten behind your back. */
function mergeScan(scan) {
  var changed = false;

  if (scan.tools && !scan.tools.unchanged && scan.tools.sig !== seen.tools && !dirty.tools) {
    state.tools = scan.tools.data; seen.tools = scan.tools.sig; changed = true;
  }
  if (scan.machines && !scan.machines.unchanged && scan.machines.sig !== seen.machines && !dirty.machines) {
    state.machines = scan.machines.data; seen.machines = scan.machines.sig; changed = true;
  }
  if (scan.holders && !scan.holders.unchanged && scan.holders.sig !== seen.holders && !dirty.holders) {
    state.holders = scan.holders.data; seen.holders = scan.holders.sig; changed = true;
  }
  if (scan.settings && !scan.settings.unchanged && scan.settings.sig !== seen.settings && !dirty.settings) {
    state.settings = Object.assign({}, DEFAULT_SETTINGS, scan.settings.data);
    seen.settings = scan.settings.sig; changed = true;
  }

  var onDisk = {};
  scan.jobs.forEach(function (m) {
    if (m.unchanged) { onDisk[m.id] = true; return; }
    var id = m.data.id;
    onDisk[id] = true;
    if (dirty.jobs[id]) return;                       // ours to save first
    var idx = -1;
    state.jobs.forEach(function (j, i) { if (j.id === id) idx = i; });
    if (idx < 0) { state.jobs.push(m.data); changed = true; }
    else if (seen.jobs[id] !== m.sig) { state.jobs[idx] = m.data; changed = true; }
    else return;
    seen.jobs[id] = m.sig;
    noteDir(m.dir, id, m.sig);
    if (m.legacy) { dirty.jobs[id] = true; scheduleFlush(); }
  });

  // Jobs deleted on another machine — but never one we created and have not
  // written out yet (those have no signature on record).
  state.jobs.filter(function (j) {
    return !onDisk[j.id] && seen.jobs[j.id] !== undefined && !dirty.jobs[j.id];
  }).forEach(function (j) {
    state.jobs = state.jobs.filter(function (x) { return x.id !== j.id; });
    delete seen.jobs[j.id];
    changed = true;
    if (state.jobId === j.id) { state.jobId = null; if (state.view === 'job') state.view = 'jobs'; }
  });

  if (changed) sortJobs();
  return changed;
}

/* ── conflicts ───────────────────────────────────────────────────────── */

var conflict = null;   // {kind:'tools'|'machines'|'settings'|'holders'|'job', id, label}

function raiseConflict(kind, id, label) {
  if (conflict) return;
  conflict = { kind: kind, id: id, label: label };
  if (!state.dialog) state.dialog = { kind: 'conflict' };   // else it waits for closeDialog
  render();
}

/* Keep mine: overwrite the file regardless of what is there now. */
function resolveKeepMine() {
  var c = conflict;
  conflict = null;
  state.dialog = null;
  if (!c) return render();
  if (c.kind === 'job') seen.jobs[c.id] = null; else seen[c.kind] = null;   // null = force
  scheduleFlush();
  render();
}

/* Take theirs: drop our unsaved edits to that file and reload it. */
function resolveTakeTheirs() {
  var c = conflict;
  conflict = null;
  state.dialog = null;
  if (!c) return render();
  flushChain = flushChain.then(async function () {
    try {
      if (c.kind === 'job') {
        delete dirty.jobs[c.id];
        var job = jobById(c.id);
        var jobsDir = await store.dir.getDirectoryHandle('jobs', { create: true });
        var parent = job && job._side ? await jobsDir.getDirectoryHandle(job._side, { create: true }) : jobsDir;
        var dh = await parent.getDirectoryHandle(job && job._dir ? job._dir : c.id);
        var m = await readJSONMeta(dh, 'job.json');
        if (m) {
          m.data._dir = job && job._dir;
          m.data._side = job && job._side;
          state.jobs = state.jobs.map(function (j) { return j.id === c.id ? m.data : j; });
          seen.jobs[c.id] = m.sig;
          noteDir((m.data._side ? m.data._side + '/' : '') + m.data._dir, c.id, m.sig);
        }
      } else {
        dirty[c.kind] = false;
        var name = c.kind + '.json';
        var meta = await readJSONMeta(store.dir, name);
        if (meta) {
          if (c.kind === 'settings') state.settings = Object.assign({}, DEFAULT_SETTINGS, meta.data);
          else state[c.kind] = meta.data;
          seen[c.kind] = meta.sig;
        }
      }
      saveLocal();
    } catch (e) { store.error = 'Reload failed: ' + (e.message || e); }
    render();
  });
}

/* ── dirty tracking and debounced writes ─────────────────────────────── */

var dirty = { tools: false, machines: false, settings: false, holders: false, jobs: {} };
var flushTimer = null;
var flushChain = Promise.resolve();

function markAllDirty() {
  dirty.tools = true; dirty.machines = true; dirty.settings = true; dirty.holders = true;
  state.jobs.forEach(function (j) { dirty.jobs[j.id] = true; });
}

function scheduleFlush() {
  saveLocal();
  if (flushTimer) clearTimeout(flushTimer);
  flushTimer = setTimeout(function () { flushNow(); }, 400);
}

function markTools() { dirty.tools = true; scheduleFlush(); }
function markMachines() { dirty.machines = true; scheduleFlush(); }
function markSettings() { dirty.settings = true; scheduleFlush(); }
function markHolders() { dirty.holders = true; scheduleFlush(); }
function markJob(id) { dirty.jobs[id] = true; scheduleFlush(); }
function markJobs(ids) { ids.forEach(function (id) { dirty.jobs[id] = true; }); scheduleFlush(); }

/* Unique within its own side of the shop — jobs/mill/WO-1042 and
   jobs/lathe/WO-1042 can coexist. */
function jobDirName(job, side) {
  var base = slug(job.jobno) || job.id;
  var taken = {};
  state.jobs.forEach(function (j) {
    if (j !== job && j._dir && machineTypeOf(j) === side) taken[j._dir] = true;
  });
  var name = base, n = 2;
  while (taken[name]) { name = base + '-' + n; n++; }
  return name;
}

/* Returns false when the file on disk has moved on since we read it — the
   caller then leaves it dirty and asks the user what to do. A recorded
   signature of null means "force", the answer to Keep mine. */
async function stale(dirHandle, name, recorded) {
  if (recorded === null || recorded === undefined) return false;
  var now = await statSig(dirHandle, name);
  return now !== null && now !== recorded;
}

async function writeJobDir(job) {
  var jobsDir = await store.dir.getDirectoryHandle('jobs', { create: true });
  var side = machineTypeOf(job);
  var sideDir = await jobsDir.getDirectoryHandle(side, { create: true });
  var want = jobDirName(job, side);
  var dh = await sideDir.getDirectoryHandle(want, { create: true });

  // Where the job lives now: a side folder, or straight under jobs/ if it
  // was written before the split.
  var oldParent = null;
  if (job._dir) {
    oldParent = job._side ? await jobsDir.getDirectoryHandle(job._side, { create: true }) : jobsDir;
  }

  // Guard against the copy in the folder having changed under us.
  var recorded = seen.jobs[job.id];
  var checkDir = oldParent ? await oldParent.getDirectoryHandle(job._dir, { create: true }) : dh;
  if (await stale(checkDir, 'job.json', recorded)) {
    raiseConflict('job', job.id, job.jobno || 'this job');
    return false;
  }

  seen.jobs[job.id] = await writeJSON(dh, 'job.json', job);
  await writeFile(dh, 'setup-sheet.html', buildSetupSheetHtml(job));

  var movedFrom = oldParent && (job._dir !== want || job._side !== side) ? job._dir : null;
  job._dir = want;
  job._side = side;
  noteDir(side + '/' + want, job.id, seen.jobs[job.id]);
  if (movedFrom) {
    try { await oldParent.removeEntry(movedFrom, { recursive: true }); } catch (e) { /* already gone */ }
  }
  return true;
}

function flushNow() {
  flushChain = flushChain.then(async function () {
    saveLocal();
    if (!store.connected || !store.dir) return;
    try {
      // Photos picked while offline (or just now) become real files here, and
      // the tool record keeps only the file name.
      var pending = state.tools.filter(function (t) { return t.imageData; });
      if (pending.length) {
        var toolsDir = await store.dir.getDirectoryHandle('tools', { create: true });
        for (var p = 0; p < pending.length; p++) {
          var t = pending[p];
          var name = imageNameFor(t);
          var fh = await toolsDir.getFileHandle(name, { create: true });
          var w = await fh.createWritable();
          await w.write(dataUrlToBlob(t.imageData));
          await w.close();
          if (t.image && t.image !== name) await deleteToolImage(t.image);
          if (imgCache[name]) { URL.revokeObjectURL(imgCache[name]); delete imgCache[name]; }
          t.image = name;
          delete t.imageData;
          dirty.tools = true;
        }
      }
      if (dirty.holders) {
        if (await stale(store.dir, 'holders.json', seen.holders)) raiseConflict('holders', null, 'the holder library');
        else { seen.holders = await writeJSON(store.dir, 'holders.json', state.holders); dirty.holders = false; }
      }
      if (dirty.tools) {
        if (await stale(store.dir, 'tools.json', seen.tools)) raiseConflict('tools', null, 'the tool registry');
        else { seen.tools = await writeJSON(store.dir, 'tools.json', state.tools); dirty.tools = false; }
      }
      if (dirty.machines) {
        if (await stale(store.dir, 'machines.json', seen.machines)) raiseConflict('machines', null, 'the machine list');
        else { seen.machines = await writeJSON(store.dir, 'machines.json', state.machines); dirty.machines = false; }
      }
      if (dirty.settings) {
        if (await stale(store.dir, 'settings.json', seen.settings)) raiseConflict('settings', null, 'the shop preferences');
        else { seen.settings = await writeJSON(store.dir, 'settings.json', state.settings); dirty.settings = false; }
      }
      var ids = Object.keys(dirty.jobs);
      for (var i = 0; i < ids.length; i++) {
        var job = state.jobs.filter(function (j) { return j.id === ids[i]; })[0];
        if (!job) { delete dirty.jobs[ids[i]]; continue; }
        if (await writeJobDir(job)) delete dirty.jobs[ids[i]];
      }
      store.lastSync = new Date();
      if (store.error.slice(0, 12) === 'Write failed') store.error = '';
    } catch (e) {
      if (folderMissing(e)) { await handleMissing(e, 'writing'); }
      else {
        store.error = 'Write failed: ' + (e && e.message ? e.message : String(e));
        if (e && e.name === 'NotAllowedError') store.connected = false;
      }
    }
    render();
  });
  return flushChain;
}

async function removeJobDir(job) {
  delete seen.jobs[job.id];
  Object.keys(seen.dirs).forEach(function (d) { if (seen.dirs[d].id === job.id) delete seen.dirs[d]; });
  if (!store.connected || !store.dir || !job._dir) return;
  try {
    var jobsDir = await store.dir.getDirectoryHandle('jobs', { create: true });
    var parent = job._side ? await jobsDir.getDirectoryHandle(job._side, { create: true }) : jobsDir;
    await parent.removeEntry(job._dir, { recursive: true });
  } catch (e) { /* nothing on disk yet */ }
}

/* ── browser-only mirror ─────────────────────────────────────────────── */

function saveLocal() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      tools: state.tools, jobs: state.jobs, machines: state.machines, settings: state.settings,
      holders: state.holders
    }, stripPrivate));
  } catch (e) { /* quota */ }
}

function loadLocal() {
  try {
    var raw = localStorage.getItem(LS_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) { return null; }
}

/* ══════════════════════════════════════════════════════════════════════
   State
   ══════════════════════════════════════════════════════════════════ */

var state = {
  view: 'dash',
  machineType: 'mill',   // which tool registry is showing
  jobType: 'mill',       // which jobs list is showing (a machine type value)
  tools: SEED.tools.slice(),
  jobs: SEED.jobs.slice(),
  machines: SEED.machines.slice(),
  holders: DEFAULT_HOLDERS.slice(),
  settings: Object.assign({}, DEFAULT_SETTINGS),
  search: '',
  pickSearch: '',
  jobId: null,
  dialog: null,
  draft: null,
  draftError: '',
  newMachineName: '',
  newMachineType: 'mill',
  newTypeName: '',
  newTypeTooling: 'mill',
  holderSearch: '',
  hDraft: null,          // the holder being edited — kept apart from `draft`
  hDraftError: '',       // so the tool dialog survives a trip to the library
  pickSearchH: ''
};

function set(patch) { Object.assign(state, patch); render(); }

function fieldsFor(mt) { return mt === 'lathe' ? LATHE_FIELDS : MILL_FIELDS; }

/* Object.assign is shallow, so the draft would share its `assembly` object
   with the saved tool — every stack edit would land on the registry whether
   or not you pressed Save. Only that key needs the deep copy; `imageData` is
   a multi-megabyte data URI and there is no reason to duplicate it. */
function cloneTool(t) {
  var c = Object.assign({}, t);
  if (t.assembly) c.assembly = JSON.parse(JSON.stringify(t.assembly));
  return c;
}

function spec(t) {
  var gl = t.gauge ? 'GL ' + t.gauge : '';
  if (t.machine === 'lathe') {
    return [t.type, t.nose ? 'R' + t.nose : '', t.hand, t.material, gl].filter(Boolean).join(' · ');
  }
  var fl = [t.flutes ? t.flutes + 'FL' : '', t.foc ? t.foc + ' LOC' : ''].filter(Boolean).join(' × ');
  return [t.type, t.dia ? '⌀' + t.dia : '', fl, t.material, gl].filter(Boolean).join(' · ');
}

function usage(toolId) {
  return state.jobs.filter(function (j) { return (j.tools || []).some(function (x) { return x.toolId === toolId; }); });
}

function sortTools(list) {
  var n = function (s) { var m = String(s || '').match(/\d+/); return m ? parseInt(m[0], 10) : 9999; };
  return list.slice().sort(function (a, b) {
    return n(a.tnum) - n(b.tnum) || String(a.tnum).localeCompare(String(b.tnum));
  });
}

/* ══════════════════════════════════════════════════════════════════════
   Tool assemblies — geometry and drawing

   One datum for everything: Z = 0 at the gauge line (the taper flange face),
   positive DOWN toward the tool tip. That is the number a setter transcribes,
   so it is the number the drawing is built on.
   ══════════════════════════════════════════════════════════════════ */

function num(v, dflt) {
  var n = parseFloat(v);
  return isFinite(n) ? n : (dflt === undefined ? 0 : dflt);
}

function fmt3(n) { return (Math.round(n * 1000) / 1000).toFixed(3); }

function holderById(id) {
  // The one being edited wins, so its dialog preview — and the tool dialog
  // underneath it — follow the numbers as they are typed. Cancel reverts.
  if (state.hDraft && state.hDraft.id === id) return state.hDraft;
  return state.holders.filter(function (h) { return h.id === id; })[0] || null;
}

function holderKindLabel(k) {
  var r = HOLDER_KINDS.filter(function (x) { return x.value === k; })[0];
  return r ? r.label : (k || '');
}

/* What the part projects past the face it mounts to. The cone and knob above
   the gauge line are drawn but never counted — they live in the spindle. */
function compLength(c) {
  if (!c) return 0;
  return (c.segs || []).reduce(function (a, g) { return a + num(g.len); }, 0);
}

/* The full drawn profile of one part, top to bottom, in part-local Z where
   0 is its mounting face. A holder's taper comes back with negative Z. */
function compProfile(c) {
  if (!c) return { segs: [], zTop: 0 };
  var out = [], z = 0, zTop = 0;
  var pre = c.kind === 'taper' ? TAPER_PRESETS[c.taper] : null;
  if (pre) {
    zTop = z = -(pre.cone + pre.knob);
    if (pre.knob > 0) {
      out.push({ z0: z, z1: z + pre.knob, dTop: pre.knobDia, dBot: pre.knobDia });
      z += pre.knob;
    }
    out.push({ z0: z, z1: z + pre.cone, dTop: pre.small, dBot: pre.gage });
    z += pre.cone;
  }
  (c.segs || []).forEach(function (g) {
    var len = num(g.len);
    out.push({ z0: z, z1: z + len, dTop: num(g.dTop, num(g.dBot)), dBot: num(g.dBot, num(g.dTop)) });
    z += len;
  });
  return { segs: out, zTop: zTop };
}

function assemblyUsage(holderId) {
  return state.tools.filter(function (t) {
    return ((t.assembly && t.assembly.stack) || []).some(function (e) { return e.ref === holderId; });
  });
}

/* Cutters that are not a plain cylinder: a chamfer cone, a dovetail that
   widens toward the tip, a lollipop ball or a T-slot disc — all of them a
   head at the tip sitting on a neck thinner than the head. One description
   covers the lot; a plain endmill just has no head. */
function cutterKind(tool) {
  var t = String((tool && tool.type) || '').toLowerCase();
  if (t.indexOf('dovetail') >= 0) return 'dovetail';
  if (t.indexOf('lollipop') >= 0 || t.indexOf('undercut') >= 0) return 'lolli';
  if (t.indexOf('t-slot') >= 0 || t.indexOf('keyseat') >= 0 || t.indexOf('woodruff') >= 0) return 'disc';
  if (t.indexOf('chamfer') >= 0) return 'chamfer';
  if (t.indexOf('face') >= 0 || t.indexOf('shell') >= 0) return 'face';
  if (t.indexOf('probe') >= 0) return 'probe';
  if (t.indexOf('bull') === 0 || t.indexOf('bull') > 0) return 'bull';
  if (t.indexOf('ball') >= 0) return 'ball';
  if (t.indexOf('drill') >= 0 || t.indexOf('spot') >= 0 || t.indexOf('center') >= 0) return 'drill';
  if (t.indexOf('reamer') >= 0) return 'reamer';
  return 'plain';
}

function cutterSpec(tool, asm, D, S, foc) {
  var kind = cutterKind(tool);
  var c = { kind: kind, D: D, N: D, S: S, headH: 0, neckLen: -1, angle: 0, tipDia: 0 };

  if (kind === 'chamfer') {
    // the cone that does the cutting, from the tip flat out to full ⌀
    c.angle = num(asm.angle, 0) || 90;
    c.tipDia = Math.min(num(asm.tipDia, 0), D);
    var half = Math.tan(Math.max(c.angle, 5) / 2 * Math.PI / 180);
    c.headH = half > 0 ? (D - c.tipDia) / 2 / half : 0;
    c.N = num(asm.neckDia, 0) || D;
    c.neckLen = num(asm.neckLen, -1);
    if (c.neckLen < 0) c.neckLen = Math.max(foc - c.headH, 0);
  } else if (kind === 'dovetail') {
    c.angle = num(asm.angle, 0) || 60;
    c.headH = num(asm.headLen, 0) || D * 0.40;
    c.N = num(asm.neckDia, 0) || D * 0.60;
  } else if (kind === 'disc') {
    c.headH = num(asm.headLen, 0) || D * 0.25;
    c.N = num(asm.neckDia, 0) || D * 0.50;
  } else if (kind === 'lolli') {
    c.headH = D;                        // a full ball on the end of the neck
    c.N = num(asm.neckDia, 0) || D * 0.50;
  } else if (kind === 'face') {
    /* A face mill is a body on an arbor, not a shank: the cutting happens at
       the bottom corner, laid over at the lead angle of the inserts. */
    c.bodyH = num(asm.bodyH, 0) || D * 0.35;
    c.lead = num(asm.lead, 0) || 45;              // 90 = square shoulder
    c.insH = Math.min(num(asm.insH, 0) || D * 0.10, c.bodyH);
    var lead = Math.max(Math.min(c.lead, 90), 5) * Math.PI / 180;
    c.tipDia = Math.max(D - 2 * c.insH / Math.tan(lead), 0);
    c.headH = c.bodyH;
    c.N = num(asm.arborDia, 0) || D * 0.40;       // what it hangs on
  } else if (kind === 'probe') {
    c.styDia = num(asm.styDia, 0) || D * 0.25;
    c.styLen = num(asm.styLen, 0) || D * 1.20;
    c.headH = c.styLen;
    c.N = num(asm.neckDia, 0) || c.styDia * 0.55;
  } else if (kind === 'bull') {
    c.cornerRad = Math.min(num(asm.cornerRad, 0) || D * 0.15, D / 2);
    c.N = num(asm.neckDia, 0) || D;
  } else if (kind === 'drill') {
    var t = String(tool.type || '').toLowerCase();
    c.angle = num(asm.angle, 0) || (t.indexOf('spot') >= 0 ? 90 : 118);
    c.N = num(asm.neckDia, 0) || D;
  } else if (kind === 'reamer') {
    c.angle = num(asm.angle, 0) || 45;            // the lead-in at the nose
    c.N = num(asm.neckDia, 0) || D;
  } else {
    c.N = num(asm.neckDia, 0) || D;
  }

  if (c.neckLen < 0) c.neckLen = num(asm.neckLen, -1);
  return c;
}

/* The one derived object. The dialog, the drawing and both print builders all
   read this, so the geometry is defined in exactly one place. Never throws —
   everything goes through num(). */
function assemblyGeom(tool) {
  var asm = (tool && tool.assembly) || {};
  var entries = asm.stack || [];
  var stickout = num(asm.stickout, 0);
  var toolDia = num(tool && tool.dia, 0);
  var shankDia = num(asm.shankDia, 0) || toolDia;
  var foc = num(tool && tool.foc, 0);
  var warn = [], missing = 0, maxDia = 0, zMin = 0, z = 0;

  var stages = entries.map(function (e, i) {
    var comp = holderById(e.ref);
    var prof = compProfile(comp);
    var len = comp ? compLength(comp) : num(e.len, 1.0);
    if (i === 0) zMin = prof.zTop;
    prof.segs.forEach(function (g) { maxDia = Math.max(maxDia, g.dTop, g.dBot); });
    var st = { u: e.u, ref: e.ref, comp: comp, missing: !comp,
      name: comp ? comp.name : 'Missing holder',
      len: len, z0: z, z1: z + len, prof: prof };
    if (!comp) missing++;
    z += len;
    return st;
  });

  var holderFront = z;
  var last = stages.length ? stages[stages.length - 1] : null;
  maxDia = Math.max(maxDia, toolDia, shankDia);

  var cut = cutterSpec(tool, asm, toolDia, shankDia, foc);
  maxDia = Math.max(maxDia, cut.N);

  var ok = stages.length > 0 && !missing && stickout > 0;
  var gauge = ok ? holderFront + stickout : null;

  if (missing) {
    warn.push(missing + (missing > 1 ? ' components are' : ' component is') +
      ' missing from the holder library — pick a replacement before the numbers mean anything.');
  }
  if (stages.length && stickout <= 0) {
    warn.push('Set the stickout — how far the cutter hangs out of the holder is what makes the gauge length.');
  }
  if (foc > 0 && stickout > 0 && foc > stickout + 0.0005) {
    warn.push('Flute length ' + fmt3(foc) + ' is longer than the ' + fmt3(stickout) +
      ' stickout — the flutes would run back inside the holder.');
  }
  if (cut.headH > 0 && stickout > 0 && cut.headH > stickout + 0.0005) {
    warn.push('The cutting head is ' + fmt3(cut.headH) + ' long but only ' + fmt3(stickout) +
      ' hangs out of the holder.');
  }
  if (cut.kind !== 'plain' && cut.kind !== 'chamfer' && cut.N >= toolDia - 0.0005 && toolDia > 0) {
    warn.push('The neck is not thinner than the head — an undercut tool needs clearance behind the cut.');
  }
  if (toolDia > 0 && stickout > toolDia * 4) {
    warn.push('Stickout is more than 4x the ' + fmt3(toolDia) + ' diameter — check deflection before you trust a heavy cut.');
  }
  if (last && last.comp && num(last.comp.gripMin) > 0 && shankDia > 0 && num(tool && tool.oal) > 0) {
    var grip = num(tool.oal) - stickout;
    if (grip < num(last.comp.gripMin)) {
      warn.push('Only ' + fmt3(Math.max(grip, 0)) + ' of shank in the ' +
        (last.comp.nose || 'holder') + ' — it wants at least ' + fmt3(num(last.comp.gripMin)) + '.');
    }
  }

  return {
    ok: ok, stages: stages, missing: missing, warn: warn,
    stickout: stickout, holderFront: holderFront, gauge: gauge,
    foc: foc, toolDia: toolDia, shankDia: shankDia, cut: cut,
    maxDia: maxDia || 1, zMin: zMin, zMax: holderFront + Math.max(stickout, 0)
  };
}

/* ── the drawing ─────────────────────────────────────────────────────────

   Built as an SVG *string*, not DOM nodes. The print sheets splice raw HTML
   (sheetShell) and buildSetupSheetHtml is synchronous, so a string is the
   only shape that serves both the screen and the printer from one code path
   — the screen just drops it into a div with innerHTML. */

var ASM_PAL = {
  screen: { holder: '#d4d4d7', taper: '#b7b7ba', cutter: '#94bce3', flute: '#597ea3',
            line: '#2b2b2d', dim: '#41607f', faint: '#7a7a7d', warn: '#a8681f' },
  print:  { holder: '#dedee0', taper: '#c9c9cc', cutter: '#c8dcf0', flute: '#41607f',
            line: '#1d1f20', dim: '#41607f', faint: '#5d5d60', warn: '#8a5416' }
};

function segPath(g, Y, X) {
  return 'M' + X(g.dTop, -1) + ' ' + Y(g.z0) +
         'L' + X(g.dTop, 1) + ' ' + Y(g.z0) +
         'L' + X(g.dBot, 1) + ' ' + Y(g.z1) +
         'L' + X(g.dBot, -1) + ' ' + Y(g.z1) + 'Z';
}

/* The cutting end, drawn from the flute start down to the tip. The tip shape
   is what tells a machinist at a glance which tool this is. */
function cutterPath(kind, zTop, zTip, dia, Y, X, c) {
  var r = dia / 2, t = kind;
  var d = 'M' + X(dia, -1) + ' ' + Y(zTop) + 'L' + X(dia, 1) + ' ' + Y(zTop);
  if (t === 'ball') {
    d += 'L' + X(dia, 1) + ' ' + Y(zTip - r) +
         'A' + (r * (X(dia, 1) - X(dia, -1)) / dia) + ' ' + (Y(zTip) - Y(zTip - r)) + ' 0 0 1 ' + X(dia, -1) + ' ' + Y(zTip - r);
  } else if (t === 'drill') {
    var pt = r / Math.tan(Math.max(c && c.angle || 118, 20) / 2 * Math.PI / 180);
    d += 'L' + X(dia, 1) + ' ' + Y(zTip - pt) + 'L' + X(0, 1) + ' ' + Y(zTip) + 'L' + X(dia, -1) + ' ' + Y(zTip - pt);
  } else if (t === 'reamer') {
    var ld = r * 0.35;
    d += 'L' + X(dia, 1) + ' ' + Y(zTip - ld) + 'L' + X(dia * 0.82, 1) + ' ' + Y(zTip) +
         'L' + X(dia * 0.82, -1) + ' ' + Y(zTip) + 'L' + X(dia, -1) + ' ' + Y(zTip - ld);
  } else if (t === 'bull') {
    var cr = Math.min((c && c.cornerRad) || r * 0.3, r);
    d += 'L' + X(dia, 1) + ' ' + Y(zTip - cr) + 'L' + X(dia - cr * 2, 1) + ' ' + Y(zTip) +
         'L' + X(dia - cr * 2, -1) + ' ' + Y(zTip) + 'L' + X(dia, -1) + ' ' + Y(zTip - cr);
  } else {
    d += 'L' + X(dia, 1) + ' ' + Y(zTip) + 'L' + X(dia, -1) + ' ' + Y(zTip);
  }
  return d + 'Z';
}

function assemblySvg(tool, opts) {
  opts = opts || {};
  var w = opts.w || 340, h = opts.h || 430;
  var labels = opts.labels !== false;
  var dias = opts.dias === undefined ? labels : !!opts.dias;
  var p = ASM_PAL[opts.theme === 'print' ? 'print' : 'screen'];
  var g = assemblyGeom(tool);
  if (!g.stages.length) return '';

  var padT = labels ? 16 : 6, padB = labels ? 16 : 6;
  var padL = labels ? Math.max(38, Math.round(w * 0.15)) : 4;
  var padR = labels ? Math.max(56, Math.round(w * 0.24)) : 4;
  var zMin = Math.min(g.zMin, 0), zMax = g.zMax;
  var totalL = Math.max(zMax - zMin, 0.1);
  var s = Math.min((h - padT - padB) / totalL, (w - padL - padR) / Math.max(g.maxDia, 0.4));
  var cx = padL + (w - padL - padR) / 2;

  /* The left margin is a single column of callouts, so they are collected and
     placed at the end: the gauge line wins, then the interface Z's, then the
     diameters, and anything that would sit on top of one already placed is
     dropped rather than overprinted. */
  var leftLabels = [];
  function leftTxt(prio, y, str) { leftLabels.push({ p: prio, y: y, s: str }); }
  function flushLeft() {
    var used = [];
    leftLabels.sort(function (a, b) { return a.p - b.p || a.y - b.y; }).forEach(function (l) {
      for (var i = 0; i < used.length; i++) { if (Math.abs(used[i] - l.y) < 9) return; }
      used.push(l.y);
      txt(4, l.y, l.s, 'start', l.p === 0 ? 8 : 8.5, l.p === 0 ? p.dim : p.faint);
    });
  }

  /* Diameters sit on the part they measure, centred on the axis and on a light
     plate so they stay readable over the steel and over the centreline. */
  var midLabels = [];
  function midTxt(y, str) { midLabels.push({ y: y, s: str }); }
  function flushMid() {
    var used = [];
    midLabels.sort(function (a, b) { return a.y - b.y; }).forEach(function (l) {
      for (var i = 0; i < used.length; i++) { if (Math.abs(used[i] - l.y) < 11) return; }
      used.push(l.y);
      var wpx = l.s.length * 4.7 + 7;
      push('<rect x="' + (cx - wpx / 2) + '" y="' + (l.y - 8) + '" width="' + wpx +
        '" height="10.5" fill="#ffffff" opacity="0.82"/>');
      txt(cx, l.y, l.s, 'middle', 8.5, p.line);
    });
  }
  function Y(z) { return Math.round((padT + (z - zMin) * s) * 10) / 10; }
  function X(dia, side) { return Math.round((cx + side * dia / 2 * s) * 10) / 10; }

  var o = [];
  function push(str) { o.push(str); }
  function txt(x, y, str, anchor, size, fill) {
    push('<text x="' + x + '" y="' + y + '" text-anchor="' + (anchor || 'start') +
      '" font-family="ui-sans-serif,system-ui,sans-serif" font-size="' + (size || 9) +
      '" fill="' + (fill || p.faint) + '">' + esc(str) + '</text>');
  }
  function arrow(x, y, dir) {   // dir 1 = pointing down
    return '<path d="M' + x + ' ' + y + 'L' + (x - 3) + ' ' + (y - 5 * dir) +
      'L' + (x + 3) + ' ' + (y - 5 * dir) + 'Z" fill="' + p.dim + '"/>';
  }

  /* centreline — the dash pattern is the standard C-L, and it is the single
     cheapest thing that makes this read as a tool print rather than a shape */
  push('<line x1="' + cx + '" y1="' + (padT - 4) + '" x2="' + cx + '" y2="' + (h - padB + 4) +
    '" stroke="' + p.line + '" stroke-width="0.7" opacity="0.4" stroke-dasharray="9 3 2 3"/>');

  /* the holder stack */
  g.stages.forEach(function (st) {
    var fill = st.comp && st.comp.kind === 'taper' ? p.taper : p.holder;
    if (st.missing) {
      var hw = Math.max(g.maxDia, 0.4) / 3 * s;
      push('<rect x="' + (cx - hw) + '" y="' + Y(st.z0) + '" width="' + (hw * 2) +
        '" height="' + (Y(st.z1) - Y(st.z0)) + '" fill="none" stroke="' + p.warn +
        '" stroke-width="1" stroke-dasharray="4 3"/>');
      return;
    }
    st.prof.segs.forEach(function (seg) {
      push('<path d="' + segPath({ z0: seg.z0 + st.z0, z1: seg.z1 + st.z0, dTop: seg.dTop, dBot: seg.dBot }, Y, X) +
        '" fill="' + fill + '" stroke="' + p.line + '" stroke-width="0.9" stroke-linejoin="round"/>');
    });
    /* the face this stage hands off at, and its Z from the gauge line */
    if (labels) {
      push('<line x1="' + Math.max(padL - 46, 1) + '" y1="' + Y(st.z1) + '" x2="' + X(g.maxDia, -1) +
        '" y2="' + Y(st.z1) + '" stroke="' + p.faint + '" stroke-width="0.5" opacity="0.55"/>');
      leftTxt(1, Y(st.z1) - 2, 'Z ' + fmt3(st.z1));
    }
    /* one label per section — the taper above the gauge line is standard for
       its designation, so it is drawn but not dimensioned */
    if (dias) {
      st.prof.segs.forEach(function (seg) {
        var z0 = seg.z0 + st.z0, z1 = seg.z1 + st.z0;
        if (z1 <= 0.0005 || Y(z1) - Y(z0) <= 12) return;
        var tapered = Math.abs(seg.dTop - seg.dBot) > 0.0005;
        var lbl = tapered ? '⌀' + fmt3(seg.dTop) + '→' + fmt3(seg.dBot) : '⌀' + fmt3(seg.dTop);
        if (Math.max(seg.dTop, seg.dBot) > 0) midTxt((Y(z0) + Y(z1)) / 2 + 3, lbl);
      });
    }
  });

  /* the cutter: shank, flutes, tip — plus the hidden length up inside the
     holder in the usual dashed hidden-line convention */
  if (g.stickout > 0 && g.toolDia > 0) {
    var c = g.cut;
    var tip = g.holderFront + g.stickout;
    var buried = g.foc > g.stickout + 0.0005;
    var edge = buried ? p.warn : p.line;
    var hid0 = g.holderFront - Math.min(0.9, g.holderFront);
    push('<path d="' + segPath({ z0: hid0, z1: g.holderFront, dTop: g.shankDia, dBot: g.shankDia }, Y, X) +
      '" fill="none" stroke="' + p.line + '" stroke-width="0.7" stroke-dasharray="3 2" opacity="0.55"/>');

    var solid = function (z0, z1, dTop, dBot, dia) {
      if (z1 - z0 <= 0.0005) return;
      push('<path d="' + segPath({ z0: z0, z1: z1, dTop: dTop, dBot: dBot }, Y, X) +
        '" fill="' + p.cutter + '" stroke="' + edge + '" stroke-width="0.9"/>');
      if (dias && dia > 0 && Y(z1) - Y(z0) > 12) midTxt((Y(z0) + Y(z1)) / 2 + 3, '⌀' + fmt3(dia));
    };
    /* the hatch is cosmetic, but it is what says "this end cuts" */
    var hatch = function (z0, z1, dia) {
      var n = Math.max(2, Math.min(9, Math.round((Y(z1) - Y(z0)) / 9)));
      for (var i = 1; i <= n; i++) {
        var ya = Y(z0) + (Y(z1) - Y(z0)) * (i / (n + 1));
        push('<line x1="' + X(dia, -1) + '" y1="' + ya + '" x2="' + X(dia, 1) + '" y2="' + (ya - 4) +
          '" stroke="' + (buried ? p.warn : p.flute) + '" stroke-width="0.6" opacity="0.7"/>');
      }
    };

    if (c.headH > 0) {
      /* a head at the tip on a neck thinner than it — dovetail, lollipop and
         T-slot, and the chamfer cone, which is the same idea the other way up */
      var headTop = Math.max(tip - c.headH, g.holderFront);
      var neckTop = c.neckLen >= 0 ? Math.max(headTop - c.neckLen, g.holderFront) : g.holderFront;
      solid(g.holderFront, neckTop, g.shankDia, g.shankDia, g.shankDia);
      solid(neckTop, headTop, c.N, c.N, c.N);
      if (c.kind === 'lolli') {
        var cyz = tip - c.D / 2;
        push('<ellipse cx="' + cx + '" cy="' + Y(cyz) + '" rx="' + (X(c.D, 1) - cx) + '" ry="' +
          (Y(tip) - Y(cyz)) + '" fill="' + p.cutter + '" stroke="' + edge + '" stroke-width="0.9"/>');
        if (dias) midTxt(Y(cyz) + 3, '⌀' + fmt3(c.D));
      } else if (c.kind === 'chamfer') {
        solid(headTop, tip, c.D, Math.min(c.tipDia, c.D), 0);
        if (dias && Y(tip) - Y(headTop) > 12) midTxt((Y(headTop) + Y(tip)) / 2 + 3, '⌀' + fmt3(c.D) + '  ' + fmt3(c.angle) + '°');
        hatch(headTop, tip, c.D * 0.7);
      } else if (c.kind === 'dovetail') {
        solid(headTop, tip, c.N, c.D, 0);
        if (dias && Y(tip) - Y(headTop) > 12) midTxt((Y(headTop) + Y(tip)) / 2 + 3, '⌀' + fmt3(c.D) + '  ' + fmt3(c.angle) + '°');
        hatch(headTop, tip, c.D * 0.8);
      } else if (c.kind === 'face') {
        /* body, then the corner laid over at the insert's lead angle */
        var cornerTop = tip - c.insH;
        solid(headTop, cornerTop, c.D, c.D, c.D);
        solid(cornerTop, tip, c.D, c.tipDia, 0);
        if (dias && Y(tip) - Y(cornerTop) > 12) midTxt((Y(cornerTop) + Y(tip)) / 2 + 3, fmt3(c.lead) + '°');
        hatch(cornerTop, tip, c.D * 0.9);
      } else if (c.kind === 'probe') {
        var ballZ = tip - c.styDia / 2;
        solid(headTop, ballZ, c.styDia, c.styDia, c.styDia);
        push('<ellipse cx="' + cx + '" cy="' + Y(ballZ) + '" rx="' + (X(c.styDia, 1) - cx) + '" ry="' +
          (Y(tip) - Y(ballZ)) + '" fill="' + p.cutter + '" stroke="' + edge + '" stroke-width="0.9"/>');
      } else {
        solid(headTop, tip, c.D, c.D, c.D);
        hatch(headTop, tip, c.D);
      }
    } else {
      var fl0 = g.foc > 0 ? Math.max(tip - g.foc, g.holderFront - 0.001) : tip;
      solid(g.holderFront, fl0, g.shankDia, g.shankDia,
        Math.abs(g.shankDia - g.toolDia) > 0.0005 ? g.shankDia : 0);
      push('<path d="' + cutterPath(c.kind, fl0, tip, g.toolDia, Y, X, c) +
        '" fill="' + p.cutter + '" stroke="' + edge + '" stroke-width="' + (buried ? 1.3 : 0.9) + '"/>');
      if (dias && Y(tip) - Y(fl0) > 12) midTxt((Y(fl0) + Y(tip)) / 2 + 3, '⌀' + fmt3(g.toolDia));
      hatch(fl0, tip, g.toolDia);
    }
  }

  /* the gauge line itself — the datum every number here is measured from.
     A thumbnail is a silhouette, so it does without. */
  if (labels) {
    push('<line x1="' + Math.max(padL - 50, 1) + '" y1="' + Y(0) + '" x2="' + Math.min(w - padR + 10, w - 1) + '" y2="' + Y(0) +
      '" stroke="' + p.dim + '" stroke-width="1" stroke-dasharray="6 3"/>');
    leftTxt(0, Y(0) - 3, 'GAUGE LINE');
  }
  flushLeft();
  flushMid();

  /* dimensions, right margin — three at most, or a 340px column turns to mud */
  if (labels && g.ok) {
    var xg = w - padR + 44, xs = w - padR + 10;
    push('<line x1="' + xs + '" y1="' + Y(g.holderFront) + '" x2="' + xs + '" y2="' + Y(g.gauge) +
      '" stroke="' + p.dim + '" stroke-width="0.9"/>');
    push(arrow(xs, Y(g.holderFront), -1) + arrow(xs, Y(g.gauge), 1));
    txt(xs + 4, (Y(g.holderFront) + Y(g.gauge)) / 2 + 3, fmt3(g.stickout), 'start', 8.5, p.dim);
    push('<line x1="' + xg + '" y1="' + Y(0) + '" x2="' + xg + '" y2="' + Y(g.gauge) +
      '" stroke="' + p.dim + '" stroke-width="0.9"/>');
    push(arrow(xg, Y(0), -1) + arrow(xg, Y(g.gauge), 1));
    txt(w - 2, Y(0) - 5, 'GL ' + fmt3(g.gauge), 'end', 9, p.dim);
  }
  if (labels && g.toolDia > 0) {
    txt(cx, Y(g.zMax) + 12, '⌀' + fmt3(g.toolDia) + (g.foc > 0 ? '  LOC ' + fmt3(g.foc) : ''), 'middle', 8.5, p.faint);
  }

  return '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h +
    '" viewBox="0 0 ' + w + ' ' + h + '" style="max-width:100%;height:auto" role="img">' + o.join('') + '</svg>';
}

/* The screen path parses the same string. innerHTML in an HTML document gives
   <svg> children the SVG namespace on its own, so there is no second
   createElementNS code path to drift out of step with the printed one. */
function assemblyDrawing(tool, opts) {
  var host = el('div', { style: 'line-height:0' });
  var markup = assemblySvg(tool, opts);
  if (!markup) return el('div', { class: 'text-muted', style: 'font-size:12px;padding:var(--space-6) 0;text-align:center',
    text: 'Nothing stacked yet — start with the taper.' });
  host.innerHTML = markup;
  return host;
}

function jobById(id) { return state.jobs.filter(function (j) { return j.id === id; })[0] || null; }

/* A job belongs to the mill or lathe side according to the machine it runs
   on. Jobs with no machine yet sit with the mills, same as a new job's
   default tool picker. */
function machineTypeOf(job) {
  var m = state.machines.filter(function (x) { return x.name === job.machine; })[0];
  if (m && m.type && typeByValue(m.type)) return m.type;
  return m && m.type ? m.type : defaultType();   // unknown type keeps its own list
}

function jobsOfType(mt) {
  return state.jobs.filter(function (j) { return machineTypeOf(j) === mt; });
}

function patchJob(id, patch) {
  var j = jobById(id);
  if (!j) return;
  Object.assign(j, patch);
  markJob(id);
  render();
}

function openJob(id) { set({ view: 'job', jobId: id, dialog: null, pickSearch: '' }); }

function closeDialog() {
  state.hDraft = null;
  state.hDraftError = '';
  set({ dialog: conflict ? { kind: 'conflict' } : null, draft: null, draftError: '' });
}

/* ══════════════════════════════════════════════════════════════════════
   Setup sheet — the same HTML is printed and written to the job folder
   ══════════════════════════════════════════════════════════════════ */

/* One compact stylesheet behind all three printouts: the job setup sheet,
   a single tool card, and the whole registry. Tight enough that a typical
   setup lands on one page. */
function printCss() {
  return '@page{margin:10mm}' +
    'body{font-family:Barlow,system-ui,sans-serif;color:#1d1f20;font-size:9.5pt;line-height:1.3;margin:0}' +
    'h1{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:17pt;margin:0;line-height:1.05}' +
    '.kick{font-size:7.5pt;letter-spacing:.1em;text-transform:uppercase;color:#5d5d60}' +
    '.hd{display:flex;justify-content:space-between;align-items:baseline;gap:12px;' +
      'border-bottom:1.2px solid #1d1f20;padding-bottom:4px;margin-bottom:7px}' +
    '.meta{display:flex;flex-wrap:wrap;gap:4px 18px;margin-bottom:8px;font-size:9pt}' +
    '.meta span{color:#5d5d60;text-transform:uppercase;font-size:7.5pt;letter-spacing:.08em;margin-right:4px}' +
    '.meta b{font-weight:600}' +
    'table{width:100%;border-collapse:collapse;font-size:9pt}' +
    'th{text-align:left;font-size:7.5pt;letter-spacing:.06em;text-transform:uppercase;color:#5d5d60;' +
      'border-bottom:1px solid #1d1f20;padding:2px 4px}' +
    'td{padding:3px 4px;border-bottom:1px solid #d4d4d7;vertical-align:top}' +
    'tr{break-inside:avoid}' +
    '.n{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:11pt;white-space:nowrap}' +
    '.sub{color:#5d5d60;font-size:8pt}' +
    '.notes{margin-top:8px;border:1px solid #b7b7ba;padding:5px 7px}' +
    '.notes h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;margin:0 0 2px;font-size:9pt;' +
      'letter-spacing:.06em;text-transform:uppercase}' +
    '.notes p{margin:0;white-space:pre-wrap}' +
    '.sign{margin-top:12px;display:grid;gap:10px;font-size:9pt}' +
    'thead{display:table-header-group}' +
    'svg{display:block}' +
    '.asm{float:right;margin:0 0 6px 10px;border:1px solid #d4d4d7;padding:4px;break-inside:avoid}' +
    '.asm text{font-family:"Barlow Condensed","Arial Narrow",sans-serif}' +
    'td.asmcell{width:70px;padding:2px}';
}

function sheetShell(title, kicker, heading, body) {
  return '<!doctype html><html><head><meta charset="utf-8"><title>' + esc(title) + '</title>' +
    '<style>' + printCss() + '</style></head><body>' +
    '<div class="hd"><div><div class="kick">' + esc(kicker) + '</div><h1>' + esc(heading) + '</h1></div>' +
    '<div class="kick">Printed ' + new Date().toLocaleDateString() + '</div></div>' +
    body + '</body></html>';
}

function shopName() { return state.settings.shopName || 'Machine shop'; }

/* ── the job setup sheet ─────────────────────────────────────────────── */

function buildSetupSheetHtml(job) {
  var diagrams = !!state.settings.setupDiagrams;
  var rows = (job.tools || []).map(function (x) {
    var t = state.tools.filter(function (y) { return y.id === x.toolId; })[0];
    if (!t) return '';
    var pic = diagrams ? '<td class="asmcell">' + (t.machine !== 'lathe'
      ? assemblySvg(t, { w: 64, h: 104, labels: false, theme: 'print' }) : '') + '</td>' : '';
    return '<tr>' + pic + '<td class="n">' + esc(t.tnum) + '</td><td>' + esc(t.desc) +
      (t.notes ? '<div class="sub">' + esc(t.notes) + '</div>' : '') +
      '</td><td>' + esc(spec(t)) +
      '</td><td>' + esc(t.machine === 'lathe' ? t.shank : t.holder) + '</td><td>' + esc(x.note) + '</td></tr>';
  }).join('');
  var signoff = state.settings.signoffLines
    ? '<div class="sign"><div>Set up by ______________________  Date __________</div>' +
      '<div>First article OK ______________________  Date __________</div></div>'
    : '';
  var body =
    '<div class="meta"><div><span>Rev</span><b>' + esc(job.rev || '—') + '</b></div>' +
    '<div><span>Machine</span><b>' + esc(job.machine || '—') + '</b></div>' +
    '<div><span>Last run</span><b>' + esc(job.lastRun || '—') + '</b></div>' +
    '<div><span>Tools</span><b>' + (job.tools || []).length + '</b></div></div>' +
    '<table><thead><tr>' + (diagrams ? '<th></th>' : '') +
    '<th>Stn</th><th>Description</th><th>Spec</th><th>Holder</th><th>Setup note</th></tr></thead><tbody>' +
    (rows || '<tr><td colspan="' + (diagrams ? 6 : 5) + '">No tools assigned.</td></tr>') + '</tbody></table>' +
    (job.notes ? '<div class="notes"><h3>Setup notes</h3><p>' + esc(job.notes) + '</p></div>' : '') +
    signoff;
  return sheetShell('Setup sheet ' + job.jobno, shopName() + ' — setup sheet', job.jobno || 'Untitled job', body);
}

/* ── one tool, with its photo ────────────────────────────────────────── */

/* The print window is a separate document, so the photo has to travel as a
   data URI rather than an object URL. */
async function imageDataUrlFor(tool) {
  if (tool.imageData) return tool.imageData;
  if (!tool.image || !store.connected || !store.dir) return null;
  try {
    var dir = await store.dir.getDirectoryHandle('tools', { create: true });
    var fh = await dir.getFileHandle(tool.image);
    var file = await fh.getFile();
    return await new Promise(function (resolve) {
      var r = new FileReader();
      // Stamp the type ourselves — these are always JPEGs, and a filesystem
      // that reports application/octet-stream would give an <img> nothing to
      // work with.
      r.onload = function () { resolve('data:image/jpeg;base64,' + String(r.result).split(',')[1]); };
      r.onerror = function () { resolve(null); };
      r.readAsDataURL(file);
    });
  } catch (e) { return null; }
}

async function buildToolSheetHtml(tool) {
  var fields = fieldsFor(tool.machine).filter(function (f) { return f.k !== 'notes' && f.k !== 'desc' && f.k !== 'tnum'; });
  var meta = fields.map(function (f) {
    return tool[f.k] ? '<div><span>' + esc(f.label) + '</span><b>' + esc(tool[f.k]) + '</b></div>' : '';
  }).join('');
  var jobs = usage(tool.id);
  var used = jobs.length
    ? '<div class="notes"><h3>Used in</h3><p>' + esc(jobs.map(function (j) { return j.jobno || '(untitled)'; }).join(', ')) + '</p></div>'
    : '';
  var photo = await imageDataUrlFor(tool);
  var img = photo
    ? '<img src="' + photo + '" style="max-width:88mm;max-height:80mm;border:1px solid #b7b7ba;margin-top:8px">'
    : '';
  var asmSvg = tool.machine !== 'lathe' ? assemblySvg(tool, { w: 190, h: 270, theme: 'print' }) : '';
  var asmGeom = asmSvg ? assemblyGeom(tool) : null;
  var asmTable = asmGeom && asmGeom.stages.length
    ? '<table style="margin-top:8px"><thead><tr><th>Assembly</th><th>Projection</th><th>Z from gauge line</th></tr></thead><tbody>' +
      asmGeom.stages.map(function (st) {
        return '<tr><td>' + esc(st.name) + '</td><td>' + fmt3(st.len) + '</td><td>' + fmt3(st.z1) + '</td></tr>';
      }).join('') +
      (asmGeom.ok ? '<tr><td>Cutter (stickout)</td><td>' + fmt3(asmGeom.stickout) + '</td><td>' + fmt3(asmGeom.gauge) + '</td></tr>' : '') +
      '</tbody></table>'
    : '';
  var body =
    (asmSvg ? '<div class="asm">' + asmSvg + '</div>' : '') +
    '<div class="meta">' + (meta || '<div><span>No details recorded</span></div>') + '</div>' + asmTable +
    (tool.notes ? '<div class="notes"><h3>Tool notes</h3><p>' + esc(tool.notes) + '</p></div>' : '') +
    used + img;
  return sheetShell('Tool ' + tool.tnum, shopName() + ' — ' + tool.machine + ' tool', tool.tnum + '  ' + (tool.desc || ''), body);
}

/* ── printing ────────────────────────────────────────────────────────── */

/* Opened on the click itself so the popup blocker lets it through; the
   contents can then be filled in asynchronously. */
function openPrintWindow() {
  var w = window.open('', '_blank', 'width=900,height=1100');
  if (w) {
    w.document.write('<!doctype html><meta charset="utf-8"><title>Printing…</title>' +
      '<p style="font:14px system-ui;padding:24px;color:#5d5d60">Preparing…</p>');
  }
  return w;
}

function finishPrint(w, html) {
  if (!w) return;
  w.document.open();
  w.document.write(html);
  w.document.close();
  w.focus();
  setTimeout(function () { w.print(); }, 300);
}

function printSheetFor(job) { finishPrint(openPrintWindow(), buildSetupSheetHtml(job)); }

function printToolCard(tool) {
  var w = openPrintWindow();
  buildToolSheetHtml(tool).then(function (html) { finishPrint(w, html); });
}

function printLibrary(mt, list) { finishPrint(openPrintWindow(), buildLibrarySheetHtml(mt, list)); }

function buildHolderSheetHtml(list) {
  var rows = list.map(function (h) {
    return '<tr><td>' + esc(h.name) + (h.notes ? '<div class="sub">' + esc(h.notes) + '</div>' : '') +
      '</td><td>' + esc(holderKindLabel(h.kind)) + '</td><td>' + esc(h.taper || '') +
      '</td><td>' + esc(h.nose || '') + '</td><td>' + fmt3(compLength(h)) +
      '</td><td>' + esc([h.vendor, h.partno].filter(Boolean).join(' · ')) +
      '</td><td>' + assemblyUsage(h.id).length + '</td></tr>';
  }).join('');
  var body =
    '<div class="meta"><div><span>Holders</span><b>' + list.length + '</b></div></div>' +
    '<table><thead><tr><th>Name</th><th>Kind</th><th>Taper</th><th>Accepts</th><th>Projection</th>' +
    '<th>Vendor · part #</th><th>Tools</th></tr></thead><tbody>' +
    (rows || '<tr><td colspan="7">Nothing in the library.</td></tr>') + '</tbody></table>';
  return sheetShell('Holder library', shopName() + ' — holder library', 'Holders', body);
}

function printHolders(list) { finishPrint(openPrintWindow(), buildHolderSheetHtml(list)); }

function syncLabel() {
  if (!FS_SUPPORTED) return 'Browser-only mode';
  if (!store.dir) return 'Connect data folder';
  if (!store.connected) return 'Sync — allow folder access';
  return 'Sync';
}

function syncStatusText() {
  if (!FS_SUPPORTED) return 'no folder access in this browser';
  if (!store.dir) return 'not connected';
  if (!store.connected) return 'folder remembered — click to reconnect';
  var parts = ['watching'];
  if (store.lastRemote) {
    parts.push('updated ' + store.lastRemote.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
  } else if (store.lastSync) {
    parts.push('saved ' + store.lastSync.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
  }
  return parts.join(' · ');
}

function syncDotClass() {
  if (!FS_SUPPORTED || !store.dir) return 'sync-dot';
  if (store.error) return 'sync-dot err';
  if (!store.connected) return 'sync-dot warn';
  return 'sync-dot ok';
}

function onSyncClick() {
  if (!FS_SUPPORTED) {
    set({ dialog: { kind: 'confirm', title: 'This browser cannot open folders',
      body: 'Writing to a data folder needs the File System Access API — Chrome or Edge, served over http://localhost (a file:// page is blocked). Your data is still kept safe in this browser in the meantime.',
      okLabel: 'OK', action: closeDialog } });
    return;
  }
  if (!store.dir) { connectFolder(); return; }
  if (!store.connected) {
    grantAndLoad().catch(function (e) {
      store.error = 'Reconnect failed: ' + (e && e.message ? e.message : String(e));
      render();
    });
    return;
  }
  flushNow().then(loadFromDisk);
}

function header() {
  var nav = el('nav', { class: 'nav', style: 'max-width:1440px;margin:0 auto;padding:var(--space-3) var(--space-6);gap:var(--space-6)' });

  var brand = el('div', { class: 'nav-brand', style: 'display:flex;align-items:baseline;gap:var(--space-2)' },
    el('span', { text: state.settings.shopName || 'Machine shop' }),
    state.settings.subtitle
      ? el('span', { class: 'text-muted', style: 'font-family:var(--font-body);font-size:11px;letter-spacing:.12em;text-transform:uppercase',
          text: state.settings.subtitle })
      : null
  );

  function link(label, view, mt) {
    var current;
    if (view === 'tools') current = state.view === 'tools' && state.machineType === mt;
    else if (view === 'jobs') {
      var openJobType = state.view === 'job' && jobById(state.jobId) ? machineTypeOf(jobById(state.jobId)) : null;
      current = (state.view === 'jobs' && state.jobType === mt) || openJobType === mt;
    } else current = state.view === view;

    var a = el('a', { href: '#', text: label, onclick: function (e) {
      e.preventDefault();
      if (view === 'tools') set({ view: 'tools', machineType: mt, search: '' });
      else if (view === 'jobs') set({ view: 'jobs', jobType: mt });
      else set({ view: view });
    } });
    if (current) a.setAttribute('aria-current', 'page');
    return a;
  }

  var links = el('div', { style: 'display:flex;align-items:center;gap:var(--space-6)' },
    link('Dashboard', 'dash'),
    visibleRegistries().map(function (g) { return link(registryLabel(g) + ' tools', 'tools', g); }),
    visibleRegistries().indexOf('mill') >= 0 ? link('Holders', 'holders') : null,
    visibleTypes().map(function (t) { return link(t.label + ' jobs', 'jobs', t.value); }),
    link('Settings', 'settings')
  );

  var sync = el('div', { class: 'sync' },
    el('span', { class: syncDotClass() }),
    el('span', { class: 'sync-text', text: syncStatusText() }),
    el('button', { class: 'btn btn-secondary', text: syncLabel(), onclick: onSyncClick })
  );

  nav.appendChild(brand);
  nav.appendChild(links);
  nav.appendChild(sync);

  var head = el('header', { style: 'position:sticky;top:0;z-index:20;background:var(--color-bg);border-bottom:1px solid var(--color-divider)' }, nav);

  if (store.error) {
    head.appendChild(el('div', { class: 'banner', text: store.error }));
  } else if (!store.connected) {
    head.appendChild(el('div', { class: 'banner', text: FS_SUPPORTED
      ? 'Changes are kept in this browser only. Connect a data folder to write jobs, tools and setup sheets to disk.'
      : 'Changes are kept in this browser only — open this page in Chrome or Edge over http://localhost to write to a data folder.' }));
  }
  return head;
}

function statCard(kicker, value, meta, onOpen) {

}

function jobRowCells(j, opts) {

  cells.push(el('td', { style: 'font-variant-numeric:tabular-nums', text: j.jobno || '(untitled)' }));
  if (opts.split) cells.push(el('td', { class: 'text-muted', text: j.rev || '—' }));

function confirmDeleteJob(j) {
  set({ dialog: {

/* Started from a jobs list, a new job lands on that side of the shop. */
function newJob(mt) {
  var want = mt || state.jobType || defaultType();
  var id = uid();
  var first = (state.machines.filter(function (m) { return m.type === want; })[0] || state.machines[0] || {}).name || '';
  state.jobs.push({ id: id, created: new Date().toISOString(), jobno: '', rev: '', machine: first, lastRun: '', notes: '', tools: [] });
  markJob(id);
  set({ view: 'job', jobId: id, jobType: want, pickSearch: '' });
}

function viewDash() {

/* Jobs point at a machine by name, so a rename has to travel to every setup
   using it — otherwise the job would lose its machine and fall back to the
   mill list. */
function renameMachine(m, newName) {
  var old = m.name;
  m.name = newName;
  markMachines();
  var touched = [];
  state.jobs.forEach(function (j) {
    if (j.machine === old) { j.machine = newName; touched.push(j.id); }
  });
  if (touched.length) markJobs(touched);
  render();
}

function confirmRemoveMachine(m) {
  var used = state.jobs.filter(function (j) { return j.machine === m.name; });
  var drop = function () {
    state.machines = state.machines.filter(function (x) { return x.id !== m.id; });
    markMachines();
    set({ dialog: null });
  };
  if (!used.length) return drop();
  set({ dialog: {
    kind: 'confirm',
    title: 'This machine is in use',
    body: m.name + ' is on ' + used.length + ' job' + (used.length > 1 ? 's' : '') +
      ' (' + used.map(function (j) { return j.jobno || '(untitled)'; }).join(', ') +
      '). Removing it leaves those setups without a machine, and they move to the mill list.',
    okLabel: 'Remove anyway',
    action: drop
  } });
}

/* Machine types live in settings.json so they travel with the shop data.
   Editing them writes the list back, replacing the built-in default. */
function setTypes(list) {
  state.settings.machineTypes = list;
  markSettings();
  render();
}

    .filter(function (t) {

    });
    colKeys.forEach(function (k) {

function assemblyCell(t) {
  var g = assemblyGeom(t);
  if (!g.stages.length) {
    return el('span', { class: 'text-muted', style: 'font-size:12px', text: '—' });

      text: g.ok ? 'GL ' + fmt3(g.gauge) : (g.missing ? '⚠' : 'no stickout') }));

/* Nothing is shown inline — the photo (and the tool's notes) open on click. */
function toolPhotoButton(t) {
  var has = !!(t.image || t.imageData);
  if (!has && !t.notes) return el('span', { class: 'text-muted', style: 'font-size:12px', text: '—' });
  return el('button', { class: 'btn btn-ghost', style: 'font-size:13px',

function confirmDeleteTool(t) {
  var used = usage(t.id);
  set({ dialog: {
    kind: 'confirm',
    title: used.length ? 'This tool is in use' : 'Delete ' + t.tnum + '?',
    body: used.length
      ? t.tnum + ' — ' + t.desc + ' is on ' + used.length + ' job' + (used.length > 1 ? 's' : '') +
        ' (' + used.map(function (j) { return j.jobno; }).join(', ') + '). Deleting it removes the tool from those setups.'
      : t.tnum + ' — ' + t.desc + ' will be removed from the registry.',
    okLabel: used.length ? 'Delete anyway' : 'Delete',
    action: function () {
      if (t.image) deleteToolImage(t.image);
      state.tools = state.tools.filter(function (x) { return x.id !== t.id; });
      var touched = [];
      state.jobs.forEach(function (j) {
        var before = (j.tools || []).length;
        j.tools = (j.tools || []).filter(function (x) { return x.toolId !== t.id; });
        if (j.tools.length !== before) touched.push(j.id);
      });
      markTools();
      if (touched.length) markJobs(touched);
      set({ dialog: null });
    }
  } });
}
